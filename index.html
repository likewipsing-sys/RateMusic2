<style>
:root{
  --bg:#F2F1F8; --surface:#FFFFFF; --ink:#17162B; --muted:#68677F; --line:#E1DFEC;
  --amber:#FFB020; --on-amber:#17162B; --danger:#C62F4B; --chip:#E8E6F3;
  --f-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --f-num:'Bricolage Grotesque','IBM Plex Sans KR',system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E0D1B; --surface:#191830; --ink:#F1F0FA; --muted:#9C9BB6; --line:#2A2947;
    --danger:#FF6B86; --chip:#232241;
  }
}
:root[data-theme="dark"]{
  --bg:#0E0D1B; --surface:#191830; --ink:#F1F0FA; --muted:#9C9BB6; --line:#2A2947;
  --danger:#FF6B86; --chip:#232241;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
[hidden]{display:none!important}

#app{max-width:560px;margin:0 auto;padding:0 16px 130px}

/* header */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);display:flex;align-items:center;gap:8px;padding:14px 0 10px;min-height:64px}
#top h1{margin:0;flex:1;font:800 28px/1.15 var(--f-num);letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.ib:active{background:var(--chip)}
.ib svg,.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#top .ib.back{margin-left:-10px}

/* chips + segmented */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 16px;border-radius:999px;background:var(--chip);font-weight:500;font-size:15px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--chip);border-radius:12px;padding:4px;margin-bottom:8px}
.seg button{padding:9px 0;border-radius:9px;font-weight:500;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.two{grid-template-columns:1fr 1fr}
.sqrow{display:flex;gap:8px}
.sqrow .in-t{flex:1;min-width:0}
.sqrow .btn{padding:0 18px}
.cand{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);margin-bottom:8px}
.cand:active{background:var(--chip)}
.cand .t{display:block;font-weight:700}
.cand .s{display:block;font-size:14px;color:var(--muted)}
.stat{margin:0 0 4px;color:var(--muted);font-size:14px}

/* rows */
.row{display:grid;grid-template-columns:36px 56px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:11px 0;border-bottom:1px solid var(--line)}
.row.nr{grid-template-columns:56px 1fr auto}
.row:active{opacity:.6}
.rk{font:800 22px/1 var(--f-num);color:var(--muted);text-align:center;letter-spacing:-.03em}
.rk.top{color:var(--ink)}
.cv{width:56px;height:56px;border-radius:7px;object-fit:cover;background:var(--chip);display:block}
.mt{display:flex;flex-direction:column;min-width:0}
.mt .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt .a{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt .g{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt .g em{font-style:normal;font-weight:700;margin-right:6px;color:var(--ink);opacity:.75}
.sc{width:48px;height:48px;border-radius:50%;background:var(--amber);color:var(--on-amber);display:grid;place-items:center;font:800 17px/1 var(--f-num);letter-spacing:-.03em;box-shadow:inset 0 0 0 4px rgba(23,22,43,.1)}
.grp{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;padding:11px 0;border-bottom:1px solid var(--line)}
.grp:active{opacity:.6}
.grp .n{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp .s{font-size:14px;color:var(--muted)}
.grp .av{font:800 20px/1 var(--f-num);letter-spacing:-.03em}

/* empty */
.empty{text-align:center;padding:56px 16px;color:var(--muted)}
.empty .rec{width:96px;height:96px;margin:0 auto 18px;display:block}
.empty h2{margin:0 0 6px;color:var(--ink);font-size:19px}
.empty p{margin:0 0 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:700}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.danger{background:var(--danger);color:#fff}
.btn.block{width:100%}
.label-s{margin:18px 0 2px;font-size:14px;font-weight:700;color:var(--muted)}

/* search */
.q{width:100%;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);margin-bottom:6px}
.q:focus{outline:2px solid var(--amber);outline-offset:0;border-color:transparent}

/* tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 6px)}
#tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);align-items:end}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 2px;font-size:12px;color:var(--muted);font-weight:500;min-height:52px;justify-content:flex-end}
.tab[aria-current="page"]{color:var(--ink);font-weight:700}
.tab.add{color:var(--ink);font-weight:700}
.tab.add .plus{width:54px;height:54px;border-radius:50%;background:var(--amber);color:var(--on-amber);display:grid;place-items:center;margin-top:-26px;box-shadow:0 0 0 5px var(--surface),inset 0 0 0 5px rgba(23,22,43,.1)}
.tab.add .plus svg{stroke-width:2.8}

/* overlay */
#overlay{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:rise .22s ease-out}
@keyframes rise{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){#overlay{animation:none}}
.sheet{max-width:560px;margin:0 auto;padding:0 16px 32px}
.sheet-top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:10px 0;min-height:60px}
.sheet-top h2{margin:0;font-size:17px}
.sheet-top .ib{margin:0 -10px}
.textbtn{padding:10px 4px;font-weight:700}

/* detail */
.hero{width:100%;aspect-ratio:1/1;max-width:340px;margin:6px auto 18px;display:block;border-radius:12px;object-fit:cover;box-shadow:0 12px 30px rgba(0,0,0,.28)}
.d-title{margin:0;font-size:26px;line-height:1.25;letter-spacing:-.02em;font-weight:700}
.d-artist{margin:2px 0 0;font-size:18px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0}
.tag{padding:4px 12px;border-radius:999px;background:var(--chip);font-size:14px}
.d-score{display:flex;align-items:center;gap:18px;margin:22px 0}
.d-score .disc{flex:none;width:112px;height:112px;border-radius:50%;background:var(--amber);color:var(--on-amber);display:grid;place-items:center;font:800 40px/1 var(--f-num);letter-spacing:-.04em;box-shadow:inset 0 0 0 8px rgba(23,22,43,.1),inset 0 0 0 9px rgba(23,22,43,.12)}
.d-score .rk2{font-size:15px;color:var(--muted)}
.d-score .rk2 b{display:block;color:var(--ink);font-size:20px}
.note{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 6px}
.note.none{color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}

/* form */
.field{margin:0 0 16px}
.field>label,.field>.lb{display:block;font-weight:700;font-size:14px;margin:0 0 6px;color:var(--muted)}
.in-t{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.in-t:focus{outline:2px solid var(--amber);outline-offset:0;border-color:transparent}
textarea.in-t{min-height:110px;resize:vertical;line-height:1.55}
.scorebox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 16px}
.scorerow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.scorenum{font:800 56px/1 var(--f-num);letter-spacing:-.04em;min-width:2.6ch;text-align:center}
.step{width:48px;height:48px;border-radius:50%;background:var(--chip);font:700 22px/1 var(--f-body);display:grid;place-items:center}
.step:active{background:var(--amber);color:var(--on-amber)}
input[type=range]{width:100%;margin:12px 0 0;accent-color:var(--amber);height:32px}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.coverrow{display:flex;gap:14px;align-items:center}
.coverrow img{width:84px;height:84px;border-radius:9px;object-fit:cover;background:var(--chip)}
.coverrow .col{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.mini{padding:9px 14px;border-radius:10px;background:var(--chip);font-weight:500;font-size:15px;display:inline-block}
.savebar{position:sticky;bottom:0;background:var(--bg);padding:12px 0 6px;margin-top:8px}
.only-song[hidden]{display:none}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
textarea.bk{font-size:13px;min-height:150px;font-family:ui-monospace,Menlo,monospace}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translate(-50%,10px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:15px;font-weight:500;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app">
  <header id="top"></header>
  <main id="main"></main>
</div>
<nav id="tabs" aria-label="메뉴"><div class="in" id="tabsIn"></div></nav>
<div id="overlay" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---------- 설정 / 상태 ---------- */
var KEY='myrating.v1';
var TYPES=[['album','앨범'],['ep','EP'],['single','싱글'],['song','노래']];
var TL={album:'앨범',ep:'EP',single:'싱글',song:'노래'};
var items=[];
var ui={tab:'rank',type:'all',by:'artist',group:null,groupName:'',q:''};
var f=null;            // 작성 중인 폼 데이터
var overlayMode=null;  // 'detail' | 'form' | 'backup'
var openId=null;
var fmode='manual',cands=[],searching=false,stype='album',lastInfo='';
var VER='v4';

function load(){
  try{
    var r=localStorage.getItem(KEY);
    if(r){var d=JSON.parse(r); if(d&&Array.isArray(d.items)) items=d.items;}
  }catch(e){}
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify({v:1,items:items}));return true;}
  catch(e){toast('저장하지 못했어요. 브라우저 저장 공간을 확인해 주세요.');return false;}
}

/* ---------- 유틸 ---------- */
function $(s,r){return (r||document).querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmt(n){return (Math.round(Number(n)*10)/10).toFixed(1);}
function uid(){return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function norm(s){return String(s||'').trim().toLowerCase();}
var toastT;
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on');},2200);}
function avg(list){if(!list.length)return 0;return list.reduce(function(a,b){return a+Number(b.score);},0)/list.length;}
function sortItems(list){return list.slice().sort(function(a,b){return (b.score-a.score)||((b.createdAt||0)-(a.createdAt||0));});}
function ranked(list){
  var s=sortItems(list),out=[];
  s.forEach(function(it,i){
    var r=(i>0&&it.score===s[i-1].score)?out[i-1].rank:i+1;
    out.push({it:it,rank:r});
  });
  return out;
}
function uniq(field){
  var seen={},out=[];
  items.forEach(function(it){var v=(it[field]||'').trim();if(v&&!seen[norm(v)]){seen[norm(v)]=1;out.push(v);}});
  return out.sort();
}

/* ---------- 아이콘 ---------- */
function svg(inner,extra){return '<svg viewBox="0 0 24 24" aria-hidden="true"'+(extra||'')+'>'+inner+'</svg>';}
var IC={
  rank:svg('<path d="M5 20v-7M12 20V4M19 20v-11"/>'),
  browse:svg('<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>'),
  search:svg('<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>'),
  plus:svg('<path d="M12 5v14M5 12h14"/>'),
  back:svg('<path d="M15 5l-7 7 7 7"/>'),
  backup:svg('<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>'),
  close:svg('<path d="M6 6l12 12M18 6L6 18"/>')
};
var RECORD='<svg class="rec" viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="46" fill="#17162B"/><circle cx="48" cy="48" r="38" fill="none" stroke="#2f2d5c" stroke-width="1.5"/><circle cx="48" cy="48" r="31" fill="none" stroke="#2f2d5c" stroke-width="1.5"/><circle cx="48" cy="48" r="24" fill="#FFB020"/><path d="M48 36l3.5 7.4 8 1-5.9 5.6 1.5 8L48 53.9l-7.1 4.1 1.5-8-5.9-5.6 8-1z" fill="#17162B"/></svg>';

/* ---------- 커버 아트 (이미지가 없을 때 자동 생성) ---------- */
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function art(it){
  var h=hash((it.title||'')+'|'+(it.artist||''));
  var hue=h%360, hue2=(hue+50+((h>>>8)%110))%360, p=(h>>>16)%4;
  var bg='hsl('+hue+' 52% 36%)', fg='hsl('+hue2+' 85% 64%)', dk='hsl('+hue+' 55% 14%)', mid='hsl('+((hue+20)%360)+' 60% 52%)';
  var b='';
  if(p===0){
    b='<circle cx="50" cy="50" r="44" fill="'+dk+'"/><circle cx="50" cy="50" r="32" fill="none" stroke="'+mid+'" stroke-width="3"/><circle cx="50" cy="50" r="22" fill="'+fg+'"/><circle cx="50" cy="50" r="4" fill="'+dk+'"/>';
  }else if(p===1){
    b='<rect y="58" width="100" height="42" fill="'+dk+'"/><circle cx="50" cy="58" r="30" fill="'+fg+'"/><rect y="58" width="100" height="42" fill="'+dk+'" opacity=".0"/><path d="M0 70h100M0 80h100M0 90h100" stroke="'+mid+'" stroke-width="3"/>';
  }else if(p===2){
    b='<rect width="50" height="50" fill="'+dk+'"/><path d="M50 0A50 50 0 0 0 0 50h50z" fill="'+fg+'"/><path d="M50 100A50 50 0 0 1 100 50H50z" fill="'+mid+'"/><circle cx="75" cy="25" r="14" fill="'+fg+'"/><rect x="0" y="50" width="50" height="50" fill="'+mid+'" opacity=".5"/>';
  }else{
    b='<path d="M0 100L100 0v100z" fill="'+dk+'"/><circle cx="34" cy="38" r="22" fill="'+fg+'"/><circle cx="34" cy="38" r="9" fill="'+bg+'"/><path d="M60 100l40-40" stroke="'+mid+'" stroke-width="6"/>';
  }
  var s='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="'+bg+'"/>'+b+'</svg>';
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(s);
}
function cover(it){return it.cover||art(it);}
function imgTag(it,cls){
  var fb=it.cover?' data-fb="'+art(it)+'"':'';
  return '<img class="'+cls+'" alt="" src="'+esc(cover(it))+'"'+fb+' loading="lazy">';
}
document.addEventListener('error',function(e){
  var t=e.target;
  if(t&&t.tagName==='IMG'&&t.dataset&&t.dataset.fb){var fb=t.dataset.fb;delete t.dataset.fb;t.src=fb;}
},true);

/* ---------- 목록 행 ---------- */
function row(it,rank){
  var rk=rank!=null?'<span class="rk'+(rank<=3?' top':'')+'">'+rank+'</span>':'';
  return '<button class="row'+(rank==null?' nr':'')+'" data-action="open" data-id="'+it.id+'">'+rk+
    imgTag(it,'cv')+
    '<span class="mt"><span class="t">'+esc(it.title)+'</span><span class="a">'+esc(it.artist)+'</span>'+
    '<span class="g"><em>'+TL[it.type]+'</em>'+esc(it.genre||'')+'</span></span>'+
    '<span class="sc" aria-label="'+fmt(it.score)+'점">'+fmt(it.score)+'</span></button>';
}
function emptyAll(){
  return '<div class="empty">'+RECORD+'<h2>아직 레이팅이 없어요</h2><p>들은 앨범이나 노래에 점수를 남겨 보세요.</p><button class="btn" data-action="new">첫 레이팅 만들기</button></div>';
}

/* ---------- 화면: 순위 ---------- */
function viewRank(){
  if(!items.length) return emptyAll();
  var chips=[['all','전체']].concat(TYPES);
  var list=ui.type==='all'?items:items.filter(function(i){return i.type===ui.type;});
  var h='<div class="chips" role="group" aria-label="종류 필터">'+chips.map(function(c){
    return '<button class="chip" data-action="type" data-v="'+c[0]+'" aria-pressed="'+(ui.type===c[0])+'">'+c[1]+'</button>';
  }).join('')+'</div>';
  if(!list.length){
    return h+'<div class="empty"><p>이 종류의 레이팅이 아직 없어요.</p><button class="btn ghost" data-action="new">새 레이팅 만들기</button></div>';
  }
  h+='<p class="stat">'+list.length+'개, 평균 '+fmt(avg(list))+'점</p>';
  h+=ranked(list).map(function(r){return row(r.it,r.rank);}).join('');
  return h;
}

/* ---------- 화면: 둘러보기 ---------- */
function groupKey(it,by){
  if(by==='artist') return norm(it.artist);
  if(by==='genre') return norm(it.genre);
  return it.type;
}
function groupLabel(it,by){
  if(by==='artist') return (it.artist||'').trim();
  if(by==='genre') return (it.genre||'').trim()||'장르 없음';
  return TL[it.type];
}
function viewBrowse(){
  if(!items.length) return emptyAll();
  if(ui.group!==null){
    var list=items.filter(function(it){return groupKey(it,ui.by)===ui.group;});
    if(!list.length){ui.group=null;return viewBrowse();}
    return '<p class="stat">'+list.length+'개, 평균 '+fmt(avg(list))+'점</p>'+
      ranked(list).map(function(r){return row(r.it,r.rank);}).join('');
  }
  var segs=[['artist','아티스트'],['genre','장르'],['type','종류']];
  var h='<div class="seg" role="group" aria-label="분류 기준">'+segs.map(function(s){
    return '<button data-action="by" data-v="'+s[0]+'" aria-pressed="'+(ui.by===s[0])+'">'+s[1]+'</button>';
  }).join('')+'</div>';
  var map={},order=[];
  items.forEach(function(it){
    var k=groupKey(it,ui.by);
    if(!map[k]){map[k]={key:k,name:groupLabel(it,ui.by),list:[]};order.push(k);}
    map[k].list.push(it);
  });
  var groups=order.map(function(k){return map[k];}).sort(function(a,b){
    return (b.list.length-a.list.length)||a.name.localeCompare(b.name,'ko');
  });
  h+=groups.map(function(g){
    var top=sortItems(g.list)[0];
    return '<button class="grp" data-action="group" data-key="'+esc(g.key)+'" data-name="'+esc(g.name)+'">'+
      imgTag(top,'cv')+
      '<span><span class="n" style="display:block">'+esc(g.name)+'</span><span class="s">'+g.list.length+'개</span></span>'+
      '<span class="av" aria-label="평균 '+fmt(avg(g.list))+'점">'+fmt(avg(g.list))+'</span></button>';
  }).join('');
  return h;
}

/* ---------- 화면: 검색 ---------- */
function searchResults(){
  var q=norm(ui.q);
  if(!q){
    var recent=items.slice().sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);}).slice(0,5);
    if(!recent.length) return emptyAll();
    return '<p class="label-s">최근 레이팅</p>'+recent.map(function(it){return row(it,null);}).join('');
  }
  var toks=q.split(/\s+/);
  var found=items.filter(function(it){
    var hay=norm([it.title,it.artist,it.genre,it.album,it.note,TL[it.type]].join(' '));
    return toks.every(function(t){return hay.indexOf(t)>-1;});
  });
  if(!found.length) return '<div class="empty"><p>“'+esc(ui.q.trim())+'”에 맞는 레이팅이 없어요.<br>제목이나 아티스트 이름 일부만 입력해 보세요.</p><button class="btn ghost" data-action="new">새 레이팅 만들기</button></div>';
  return '<p class="stat">'+found.length+'개를 찾았어요</p>'+sortItems(found).map(function(it){return row(it,null);}).join('');
}
function viewSearch(){
  return '<input id="q" class="q" type="search" placeholder="제목, 아티스트, 장르, 메모로 찾기" value="'+esc(ui.q)+'" autocomplete="off" enterkeyhint="search"><div id="results">'+searchResults()+'</div>';
}

/* ---------- 메인 렌더 ---------- */
function render(){
  var top=$('#top'),main=$('#main');
  var title='순위',left='',right='';
  if(ui.tab==='rank'){right='<button class="ib" data-action="backup" aria-label="백업과 복원">'+IC.backup+'</button>';}
  if(ui.tab==='browse'){
    title='둘러보기';
    if(ui.group!==null){title=ui.groupName;left='<button class="ib back" data-action="back" aria-label="뒤로">'+IC.back+'</button>';}
  }
  if(ui.tab==='search') title='검색';
  top.innerHTML=left+'<h1>'+esc(title)+'</h1>'+right;
  main.innerHTML=ui.tab==='rank'?viewRank():ui.tab==='browse'?viewBrowse():viewSearch();
  var t=[['rank','순위',IC.rank],['browse','둘러보기',IC.browse],['__new','',''],['search','검색',IC.search]];
  $('#tabsIn').innerHTML=
    '<button class="tab" data-action="tab" data-v="rank"'+(ui.tab==='rank'?' aria-current="page"':'')+'>'+IC.rank+'순위</button>'+
    '<button class="tab" data-action="tab" data-v="browse"'+(ui.tab==='browse'?' aria-current="page"':'')+'>'+IC.browse+'둘러보기</button>'+
    '<button class="tab add" data-action="new"><span class="plus">'+IC.plus+'</span>새 레이팅</button>'+
    '<button class="tab" data-action="tab" data-v="search"'+(ui.tab==='search'?' aria-current="page"':'')+'>'+IC.search+'검색</button>';
}

/* ---------- 오버레이 공통 ---------- */
function showOverlay(html,mode){
  var o=$('#overlay');
  o.innerHTML=html;o.hidden=false;o.scrollTop=0;overlayMode=mode;
  document.body.style.overflow='hidden';
}
function closeOverlay(){
  var o=$('#overlay');o.hidden=true;o.innerHTML='';overlayMode=null;f=null;
  document.body.style.overflow='';
}

/* ---------- 상세 ---------- */
function openDetail(id){
  var it=items.find(function(x){return x.id===id;});
  if(!it) return;
  openId=id;
  var same=items.filter(function(x){return x.type===it.type;});
  var r=ranked(same).find(function(x){return x.it.id===id;});
  var tags='<span class="tag">'+TL[it.type]+'</span>';
  if(it.genre) tags+='<span class="tag">'+esc(it.genre)+'</span>';
  if(it.type==='song'&&it.album) tags+='<span class="tag">수록: '+esc(it.album)+'</span>';
  var d=new Date(it.createdAt||Date.now());
  var date=d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일';
  showOverlay(
    '<div class="sheet"><div class="sheet-top"><button class="ib" data-action="close" aria-label="닫기">'+IC.close+'</button><span class="stat" style="margin:0">'+date+'</span></div>'+
    imgTag(it,'hero')+
    '<h2 class="d-title">'+esc(it.title)+'</h2><p class="d-artist">'+esc(it.artist)+'</p>'+
    '<div class="tags">'+tags+'</div>'+
    '<div class="d-score"><div class="disc" aria-label="'+fmt(it.score)+'점">'+fmt(it.score)+'</div>'+
    '<div class="rk2">'+TL[it.type]+' 중<b>'+r.rank+'위 / '+same.length+'개</b></div></div>'+
    (it.note&&it.note.trim()?'<p class="note">'+esc(it.note)+'</p>':'<p class="note none">남긴 메모가 없어요.</p>')+
    '<div class="actions"><button class="btn ghost" data-action="edit" data-id="'+it.id+'">수정</button>'+
    '<button class="btn ghost" data-action="del" data-id="'+it.id+'" id="delBtn">삭제</button></div></div>',
    'detail');
}

/* ---------- 작성 / 수정 폼 ---------- */
function openForm(id){
  var ex=id?items.find(function(x){return x.id===id;}):null;
  f=ex?JSON.parse(JSON.stringify(ex)):{type:(ui.type!=='all'?ui.type:'album'),title:'',artist:'',genre:'',album:'',score:7,note:'',cover:''};
  fmode=!ex?'search':'manual';cands=[];stype='album';
  var artists=uniq('artist'),genres=uniq('genre');
  var chips=TYPES.map(function(t){
    return '<button type="button" class="chip" data-action="ftype" data-v="'+t[0]+'" aria-pressed="'+(f.type===t[0])+'">'+t[1]+'</button>';
  }).join('');
  showOverlay(
    '<div class="sheet"><div class="sheet-top"><button class="ib" data-action="close" aria-label="닫기">'+IC.close+'</button><h2>'+(ex?'레이팅 수정':'새 레이팅')+'</h2><span style="width:24px"></span></div>'+
    '<div id="modeSeg"></div><div id="searchPanel" hidden></div><div id="manualFields">'+
    '<div class="field"><span class="lb">종류</span><div class="chips" style="padding-bottom:0" id="ftypes">'+chips+'</div></div>'+
    '<div class="field"><label for="f-title">제목</label><input class="in-t" id="f-title" data-f="title" value="'+esc(f.title)+'" placeholder="앨범 또는 노래 제목" autocomplete="off"></div>'+
    '<div class="field"><label for="f-artist">아티스트</label><input class="in-t" id="f-artist" data-f="artist" list="dl-artist" value="'+esc(f.artist)+'" placeholder="아티스트 이름" autocomplete="off"><datalist id="dl-artist">'+artists.map(function(a){return '<option value="'+esc(a)+'">';}).join('')+'</datalist></div>'+
    '<div class="field"><label for="f-genre">장르</label><input class="in-t" id="f-genre" data-f="genre" list="dl-genre" value="'+esc(f.genre)+'" placeholder="예: 인디 록, 힙합, R&B" autocomplete="off"><datalist id="dl-genre">'+genres.map(function(a){return '<option value="'+esc(a)+'">';}).join('')+'</datalist></div>'+
    '<div class="field only-song" id="albumField"'+(f.type==='song'?'':' hidden')+'><label for="f-album">수록 앨범 (선택)</label><input class="in-t" id="f-album" data-f="album" value="'+esc(f.album||'')+'" placeholder="노래가 들어 있는 앨범" autocomplete="off"></div>'+
    '<div class="field"><span class="lb">점수</span><div class="scorebox"><div class="scorerow">'+
      '<button type="button" class="step" data-action="step" data-v="-0.1" aria-label="0.1 내리기">−</button>'+
      '<div class="scorenum" id="scoreNum">'+fmt(f.score)+'</div>'+
      '<button type="button" class="step" data-action="step" data-v="0.1" aria-label="0.1 올리기">+</button></div>'+

    '<div class="field"><span class="lb">커버 이미지 (선택)</span><div class="coverrow"><img id="coverPrev" alt="" src="'+esc(f.cover||art(f))+'" data-fb="'+art(f)+'"><div class="col">'+

  renderMode();

  }

function applyType(v){

  var af=$('#albumField');if(af)af.hidden=(v!=='song');
}
function jsonp(url){
  return new Promise(function(res,rej){
    var cb='__it'+Date.now()+Math.floor(Math.random()*1000),sc=document.createElement('script');
    var t=setTimeout(function(){clean();rej(new Error('timeout'));},10000);
    function clean(){clearTimeout(t);try{delete window[cb];}catch(e){window[cb]=undefined;}if(sc.parentNode)sc.parentNode.removeChild(sc);}
    window[cb]=function(d){clean();res(d);};
    sc.onerror=function(){clean();rej(new Error('net'));};
    sc.src=url+'&callback='+cb;document.head.appendChild(sc);
  });
}
function itunes(term,entity,country){
  var url='https://itunes.apple.com/search?limit=25&country='+country+'&entity='+entity+'&term='+encodeURIComponent(term);
  return fetch(url).then(function(r){if(!r.ok)throw new Error('http');return r.json();}).catch(function(){return jsonp(url);});
}
function bigArt(u,n){return u?u.replace(/\d+x\d+bb/,n+'x'+n+'bb'):'';}
function mapResults(d,entity){
  var out=[],seen={};
  ((d&&d.results)||[]).forEach(function(r){
    var c;
    if(entity==='album'){
      if(!r.collectionName)return;
      var title=r.collectionName,type='album';
      if(/\s-\s*EP$/i.test(title)){type='ep';title=title.replace(/\s-\s*EP$/i,'');}
      else if(/\s-\s*(Single|싱글)$/i.test(title)){type='single';title=title.replace(/\s-\s*(Single|싱글)$/i,'');}
      c={type:type,title:title,artist:r.artistName||'',genre:r.primaryGenreName||'',year:(r.releaseDate||'').slice(0,4),album:''};
    }else{
      if(!r.trackName)return;
      c={type:'song',title:r.trackName,artist:r.artistName||'',genre:r.primaryGenreName||'',year:(r.releaseDate||'').slice(0,4),
         album:(r.collectionName||'').replace(/\s-\s*(EP|Single|싱글)$/i,'')};
    }
    c.thumb=bigArt(r.artworkUrl100,100);c.cover=bigArt(r.artworkUrl100,600);
    var k=norm(c.title+'|'+c.artist+'|'+c.type);
    if(seen[k])return;seen[k]=1;out.push(c);
  });
  return out;
}
function renderCands(){
  var box=$('#cands');if(!box)return;
  if(!cands.length){box.innerHTML='<p class="hint">결과가 없어요. 아티스트 이름은 영어 표기로 검색해 보세요. (예: YOASOBI the book) 그래도 없으면 직접 입력해 주세요.</p><p class="hint" style="font-size:12px">진단: '+esc(lastInfo||'-')+' ('+VER+')</p>';return;}
  box.innerHTML=cands.map(function(c,i){
    var meta=[TL[c.type],c.year,c.genre].filter(Boolean).join(', ');
    return '<button type="button" class="cand" data-action="pick" data-i="'+i+'"><img class="cv" alt="" src="'+esc(c.thumb||art(c))+'" data-fb="'+art(c)+'" style="width:52px;height:52px"><span><span class="t">'+esc(c.title)+'</span><span class="s">'+esc(c.artist)+(c.type==='song'&&c.album?', '+esc(c.album):'')+'</span><span class="s">'+esc(meta)+'</span></span></button>';
  }).join('');
}
function runSearch(){
  var inp=$('#sq'),q=inp?inp.value.trim():'';
  if(!q){toast('검색어를 입력해 주세요');return;}
  if(searching)return;
  searching=true;cands=[];
  var box=$('#cands');if(box)box.innerHTML='<p class="hint">찾는 중…</p>';
  var entity=stype==='song'?'song':'album';
  var info=[];
  function cnt(d){return ((d&&d.results&&d.results.length)||0)+'건'+(d&&d.errorMessage?' ['+d.errorMessage+']':'');}
  var variants=[q];
  var latin=q.split(/\s+/).filter(function(t){return !/[\u3131-\u318E\uAC00-\uD7A3]/.test(t);}).join(' ').trim();
  if(latin&&latin!==q)variants.push(latin);
  var qt=norm(q).split(/\s+/);
  function relevance(c){
    var hay=norm(c.title+' '+c.artist+' '+(c.album||''));
    return qt.filter(function(t){return hay.indexOf(t)>-1;}).length;
  }
  function attempt(vi,ci){
    // vi: 검색어 변형 번호, ci: 0=한국 스토어, 1=미국 스토어
    if(vi>=variants.length)return Promise.resolve([]);
    var country=ci===0?'KR':'US';
    return itunes(variants[vi],entity,country).then(function(d){
      info.push(country+' "'+variants[vi]+'" '+cnt(d));
      var r=mapResults(d,entity);
      if(r.length)return r;
      return ci===0?attempt(vi,1):attempt(vi+1,0);
    },function(){
      info.push(country+' 오류');
      return ci===0?attempt(vi,1):attempt(vi+1,0);
    });
  }
  attempt(0,0).then(function(r){
    r=r.map(function(c,i){return {c:c,i:i,s:relevance(c)};}).sort(function(a,b){return (b.s-a.s)||(a.i-b.i);}).map(function(x){return x.c;});
    cands=r;lastInfo=info.join(', ');renderCands();
  }).catch(function(err){
    var b=$('#cands');if(b)b.innerHTML='<p class="hint">검색하지 못했어요. 인터넷 연결을 확인하거나 직접 입력해 주세요.</p><p class="hint" style="font-size:12px">진단: '+esc((err&&err.message)||'오류')+' ('+VER+')</p>';
  }).then(function(){searching=false;});
}
function pickCand(i){
  var c=cands[i];if(!c||!f)return;
  f.title=c.title;f.artist=c.artist;f.genre=c.genre||'';f.album=c.type==='song'?(c.album||''):'';f.cover=c.cover||'';
  [['f-title',f.title],['f-artist',f.artist],['f-genre',f.genre],['f-album',f.album]].forEach(function(p){var el=$('#'+p[0]);if(el)el.value=p[1];});
  applyType(c.type);
  var pv=$('#coverPrev');if(pv){pv.src=f.cover||art(f);pv.dataset.fb=art(f);}
  var rm=$('#coverRm');if(rm)rm.hidden=!f.cover;
  fmode='manual';renderMode();
  var ov=$('#overlay');if(ov)ov.scrollTop=0;
  toast('자동으로 입력했어요. 내용을 확인해 주세요');
}
function setScore(v){
  v=Math.max(0,Math.min(10,Math.round(Number(v)*10)/10));
  f.score=v;
  var n=$('#scoreNum'),r=$('#scoreRange');
  if(n)n.textContent=fmt(v);
  if(r)r.value=v;
}
function readCover(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){
      var im=new Image();
      im.onload=function(){
        var S=400,c=document.createElement('canvas');c.width=c.height=S;
        var m=Math.min(im.width,im.height),sx=(im.width-m)/2,sy=(im.height-m)/2;
        c.getContext('2d').drawImage(im,sx,sy,m,m,0,0,S,S);
        res(c.toDataURL('image/jpeg',0.82));
      };
      im.onerror=rej;im.src=fr.result;
    };
    fr.onerror=rej;fr.readAsDataURL(file);
  });
}
function saveForm(){
  if(!f.title.trim()){toast('제목을 입력해 주세요');var t=$('#f-title');if(t)t.focus();return;}
  if(!f.artist.trim()){toast('아티스트를 입력해 주세요');var a=$('#f-artist');if(a)a.focus();return;}
  var now=Date.now();
  var rec={
    id:f.id||uid(),type:f.type,title:f.title.trim(),artist:f.artist.trim(),genre:(f.genre||'').trim(),
    album:f.type==='song'?(f.album||'').trim():'',score:f.score,note:(f.note||'').trim(),
    cover:f.cover||'',createdAt:f.createdAt||now,updatedAt:now
  };
  var idx=items.findIndex(function(x){return x.id===rec.id;});
  var backup=items.slice();
  if(idx>-1)items[idx]=rec;else items.push(rec);
  if(!save()){items=backup;return;}
  var wasEdit=idx>-1;
  closeOverlay();render();
  toast(wasEdit?'수정했어요':'저장했어요');
  openDetail(rec.id);
}

    '<div class="field" style="margin-top:14px"><label for="bk">백업 내용</label><textarea id="bk" class="in-t bk" spellcheck="false">'+esc(json)+'</textarea></div>'+

    'backup');
}
function doRestore(){
  var raw=$('#bk').value.trim(),d;
  try{d=JSON.parse(raw);}catch(e){toast('백업 내용을 읽을 수 없어요');return;}
  var arr=Array.isArray(d)?d:(d&&d.items);
  if(!Array.isArray(arr)){toast('백업 내용을 읽을 수 없어요');return;}
  var out=[];
  arr.forEach(function(x){
    if(!x||typeof x!=='object'||!x.title)return;
    var sc=Number(x.score);if(isNaN(sc))sc=0;
    out.push({
      id:String(x.id||uid()),type:TL[x.type]?x.type:'album',title:String(x.title),artist:String(x.artist||'알 수 없음'),
      genre:String(x.genre||''),album:String(x.album||''),score:Math.max(0,Math.min(10,Math.round(sc*10)/10)),
      note:String(x.note||''),cover:typeof x.cover==='string'&&(x.cover.indexOf('data:image/')===0||x.cover.indexOf('https://')===0)?x.cover:'',
      createdAt:Number(x.createdAt)||Date.now(),updatedAt:Number(x.updatedAt)||Date.now()
    });
  });
  var prev=items;items=out;
  if(!save()){items=prev;return;}
  closeOverlay();render();toast(out.length+'개의 레이팅을 복원했어요');
}

var armed={};
function arm(btn,key,armedText,onConfirm){
  if(armed[key]){clearTimeout(armed[key].t);var orig=armed[key];armed[key]=null;onConfirm();return;}
  var orig=btn.textContent;
  btn.textContent=armedText;btn.classList.add('danger');btn.classList.remove('ghost');
  armed[key]={t:setTimeout(function(){armed[key]=null;btn.textContent=orig;btn.classList.remove('danger');btn.classList.add('ghost');},3500)};
}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-action]');
  if(!el)return;
  var a=el.dataset.action,v=el.dataset.v;
  if(a==='tab'){ui.tab=v;ui.group=null;render();window.scrollTo(0,0);if(v==='search'){var q=$('#q');if(q&&!ui.q)q.focus();}}
  else if(a==='new'){openForm(null);}
  else if(a==='type'){ui.type=v;render();}
  else if(a==='by'){ui.by=v;ui.group=null;render();}
  else if(a==='group'){ui.group=el.dataset.key;ui.groupName=el.dataset.name;render();window.scrollTo(0,0);}
  else if(a==='back'){ui.group=null;render();}
  else if(a==='open'){openDetail(el.dataset.id);}
  else if(a==='close'){closeOverlay();}
  else if(a==='edit'){openForm(el.dataset.id);}
  else if(a==='del'){
    var id=el.dataset.id;
    arm(el,'del','정말 삭제할까요? 한 번 더 누르세요',function(){
      var prev=items;items=items.filter(function(x){return x.id!==id;});
      if(!save()){items=prev;return;}
      closeOverlay();render();toast('삭제했어요');
    });
  }
  else if(a==='ftype'){
    applyType(v);
  }
  else if(a==='fmode'){fmode=v;renderMode();setTimeout(function(){var t=$(v==='search'?'#sq':'#f-title');if(t)t.focus();},50);}
  else if(a==='dosearch'){runSearch();}
  else if(a==='stype'){stype=v;document.querySelectorAll('#stypes .chip').forEach(function(c){c.setAttribute('aria-pressed',String(c.dataset.v===v));});var q0=$('#sq');if(q0&&q0.value.trim())runSearch();}
  else if(a==='pick'){pickCand(Number(el.dataset.i));}
  else if(a==='step'){setScore(f.score+Number(v));}
  else if(a==='rmcover'){f.cover='';$('#coverPrev').src=art(f);el.hidden=true;}
  else if(a==='savef'){saveForm();}
  else if(a==='backup'){openBackup();}
  else if(a==='copy'){
    var ta=$('#bk');
    ta.focus();ta.select();
    var ok=false;
    try{ok=document.execCommand('copy');}catch(err){}
    if(!ok&&navigator.clipboard){navigator.clipboard.writeText(ta.value).then(function(){toast('복사했어요');},function(){toast('길게 눌러 직접 복사해 주세요');});return;}
    toast(ok?'복사했어요':'길게 눌러 직접 복사해 주세요');
  }
  else if(a==='restore'){
    arm(el,'restore','정말 덮어쓸까요? 한 번 더 누르세요',doRestore);
  }
});
