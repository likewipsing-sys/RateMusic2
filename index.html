<style>
:root{
  --bg:#F2F1F8; --surface:#FFFFFF; --ink:#17162B; --muted:#68677F; --line:#BDB9D1;
  --amber:#FFB020; --on-amber:#17162B; --danger:#C62F4B; --chip:#E8E6F3;
  --t3num:#F2C94C;
  --f-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --f-num:'Bricolage Grotesque','IBM Plex Sans KR',system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E0D1B; --surface:#191830; --ink:#F1F0FA; --muted:#9C9BB6; --line:#4A4872;
    --danger:#FF6B86; --chip:#232241; --t3num:#B7791F;
  }
}
:root[data-theme="dark"]{
  --bg:#0E0D1B; --surface:#191830; --ink:#F1F0FA; --muted:#9C9BB6; --line:#4A4872;
  --danger:#FF6B86; --chip:#232241; --t3num:#B7791F;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
[hidden]{display:none!important}

#app{max-width:560px;margin:0 auto;padding:0 16px 130px}

/* header */
body::before{content:'';position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60;pointer-events:none}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1.5px solid transparent;transition:border-color .15s;display:flex;align-items:center;gap:8px;padding:14px 0 10px;min-height:64px}
#top.scrolled{border-bottom-color:var(--line)}
#top h1{margin:0;flex:1;font:800 28px/1.15 var(--f-num);letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.ib{position:relative}
.ib:active{background:var(--chip)}
.sdot{position:absolute;top:8px;right:8px;width:11px;height:11px;border-radius:50%;border:2px solid var(--bg);background:var(--muted)}
.sdot.s-idle{background:#34B36B}.sdot.s-saving{background:#F0B13A}.sdot.s-error{background:#E0445A}.sdot.s-off{background:var(--muted)}
.accstat{display:flex;align-items:center;gap:8px;margin:0 0 4px}
.accstat i{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.accstat i.s-idle{background:#34B36B}.accstat i.s-saving{background:#F0B13A}.accstat i.s-error{background:#E0445A}
.ib svg,.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#top .ib.back{margin-left:-10px}

/* chips + segmented */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 16px;border-radius:999px;background:var(--chip);font-weight:500;font-size:15px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--chip);border-radius:12px;padding:4px;margin-bottom:8px}
.seg button{padding:9px 0;border-radius:9px;font-weight:500;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.two{grid-template-columns:1fr 1fr}
.sqrow{display:flex;gap:8px}
.sqrow .in-t{flex:1;min-width:0}
.sqrow .btn{padding:0 18px}
.cand{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);margin-bottom:8px}
.cand:active{background:var(--chip)}
.cand .t{display:block;font-weight:700}
.cand .s{display:block;font-size:14px;color:var(--muted)}
.stat{margin:0 0 4px;color:var(--muted);font-size:14px}

/* rows */
.row{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 0;border-bottom:1.5px solid var(--line)}
.row.nr{grid-template-columns:1fr auto}
.row:active{opacity:.6}
.rowx{display:flex;align-items:center;border-bottom:1.5px solid var(--line)}
.rowx .row{flex:1;min-width:0;border-bottom:0}
.grip,.gripsp{flex:none;width:38px;height:56px;display:grid;place-items:center}
.grip{color:var(--muted);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.rowx.dragging{background:var(--surface);box-shadow:0 8px 22px rgba(0,0,0,.28);border-radius:12px;position:relative;z-index:5;border-bottom-color:transparent}
.rowx.dragging .grip{cursor:grabbing;color:var(--ink)}
.rk{font:800 22px/1 var(--f-num);color:var(--muted);text-align:center;letter-spacing:-.03em}
.rk.top{color:var(--ink)}
.mt{display:flex;flex-direction:column;min-width:0}
.mt .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt .a{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt .g{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt .g em{font-style:normal;font-weight:700;margin-right:6px;color:var(--ink);opacity:.75}
.sc{width:48px;height:48px;border-radius:50%;background:var(--amber);color:var(--on-amber);display:grid;place-items:center;font:800 17px/1 var(--f-num);letter-spacing:-.03em;box-shadow:inset 0 0 0 4px var(--ring,rgba(23,22,43,.1)),0 0 0 1px var(--edge,transparent)}
.grp{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;width:100%;text-align:left;padding:12px 0;border-bottom:1.5px solid var(--line)}
.grp:active{opacity:.6}
.grp .n{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp .s{font-size:14px;color:var(--muted)}
.sc.sm{width:44px;height:44px;font-size:15px}

/* empty */
.empty{text-align:center;padding:56px 16px;color:var(--muted)}
.empty .rec{width:96px;height:96px;margin:0 auto 18px;display:block}
.empty h2{margin:0 0 6px;color:var(--ink);font-size:19px}
.empty p{margin:0 0 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:700}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.danger{background:var(--danger);color:#fff}
.btn.block{width:100%}
.label-s{margin:18px 0 2px;font-size:14px;font-weight:700;color:var(--muted)}

/* search */
.q{width:100%;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);margin-bottom:6px}
.q:focus{outline:2px solid var(--amber);outline-offset:0;border-color:transparent}

/* tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1.5px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 6px)}
#tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);align-items:end}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 2px;font-size:12px;color:var(--muted);font-weight:500;min-height:52px;justify-content:flex-end}
.tab[aria-current="page"]{color:var(--ink);font-weight:700}
.tab.add{color:var(--ink);font-weight:700}
.tab.add .plus{width:54px;height:54px;border-radius:50%;background:var(--amber);color:var(--on-amber);display:grid;place-items:center;margin-top:-26px;box-shadow:0 0 0 5px var(--surface),inset 0 0 0 5px rgba(23,22,43,.1)}
.tab.add .plus svg{stroke-width:2.8}

/* overlay */
#overlay{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:rise .22s ease-out}
@keyframes rise{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){#overlay{animation:none}}
.sheet{max-width:560px;margin:0 auto;padding:0 16px 32px}
.sheet-top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:10px 0;min-height:60px}
.sheet-top h2{margin:0;font-size:17px}
.sheet-top .ib{margin:0 -10px}
.textbtn{padding:10px 4px;font-weight:700}

/* detail */
.d-title{margin:0;font-size:26px;line-height:1.25;letter-spacing:-.02em;font-weight:700}
.d-artist{margin:2px 0 0;font-size:18px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0}
.tag{padding:4px 12px;border-radius:999px;background:var(--chip);font-size:14px}
.d-score{display:flex;align-items:center;gap:18px;margin:22px 0}
.d-score .disc{flex:none;width:112px;height:112px;border-radius:50%;background:var(--amber);color:var(--on-amber);display:grid;place-items:center;font:800 40px/1 var(--f-num);letter-spacing:-.04em;box-shadow:inset 0 0 0 8px var(--ring,rgba(23,22,43,.1)),inset 0 0 0 9px var(--ring,rgba(23,22,43,.12)),0 0 0 1px var(--edge,transparent)}
.d-score .rk2{font-size:15px;color:var(--muted)}
.d-score .rk2 b{display:block;color:var(--ink);font-size:20px}
.note{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 6px}
.note.none{color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}

/* form */
.field{margin:0 0 16px}
.field>label,.field>.lb{display:block;font-weight:700;font-size:14px;margin:0 0 6px;color:var(--muted)}
.in-t{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.in-t:focus{outline:2px solid var(--amber);outline-offset:0;border-color:transparent}
textarea.in-t{min-height:110px;resize:vertical;line-height:1.55}
.scorebox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 16px}
.scorerow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.scorenum{flex:none;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font:800 34px/1 var(--f-num);letter-spacing:-.04em;background:var(--amber);color:var(--on-amber);box-shadow:inset 0 0 0 6px var(--ring,rgba(23,22,43,.1)),0 0 0 1px var(--edge,transparent)}
.step{width:48px;height:48px;border-radius:50%;background:var(--chip);font:700 22px/1 var(--f-body);display:grid;place-items:center}
.step:active{background:var(--amber);color:var(--on-amber)}
input[type=range]{width:100%;margin:12px 0 0;accent-color:var(--amber);height:32px}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.mini{padding:9px 14px;border-radius:10px;background:var(--chip);font-weight:500;font-size:15px;display:inline-block}
.savebar{position:sticky;bottom:0;background:var(--bg);padding:12px 0 6px;margin-top:8px}
.only-song[hidden]{display:none}
.player{margin:18px 0 0}
.pframe{display:block;width:100%;border:0;border-radius:12px;overflow:hidden;background:transparent}
.plinks{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.plinks a{text-decoration:none;color:var(--ink)}
.dup{margin-top:8px;padding:10px 12px;border-radius:10px;background:rgba(224,68,90,.12);color:var(--danger);font-size:14px;font-weight:500}
.linkbtn{font-weight:700;text-decoration:underline;color:inherit;padding:0 2px}
.t3{background:var(--ink);color:var(--bg);border-radius:18px;padding:18px 16px 6px;margin:2px 0 18px}
.t3 h2{margin:0;font:800 24px/1.1 var(--f-num);letter-spacing:-.02em}
.t3 .sub{margin:3px 0 10px;font-size:13px;opacity:.7}
.t3row{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:13px 0;box-shadow:inset 0 1.5px 0 rgba(140,140,160,.65)}
.t3row:active{opacity:.65}
.t3n{flex:none;width:30px;font:800 32px/1 var(--f-num);color:var(--t3num)}
.t3m{min-width:0;flex:1}
.t3m span{display:block}
.t3t{font-weight:700;font-size:17px;line-height:1.3}
.t3a{font-size:14px;opacity:.78}
.t3note{font-size:14px;margin-top:5px;opacity:.92;white-space:pre-wrap}
.t3empty{opacity:.6}
.combo{position:relative}
.combo .in-t{padding-right:46px}
.combo-btn{position:absolute;right:0;top:0;bottom:0;width:46px;display:grid;place-items:center;color:var(--muted)}
.combo-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.22);max-height:236px;overflow-y:auto;overscroll-behavior:contain}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line)}
.opt:last-child{border-bottom:0}
.opt:active{background:var(--chip)}
.opt .c{font-size:13px;color:var(--muted);flex:none}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
textarea.bk{font-size:13px;min-height:150px;font-family:ui-monospace,Menlo,monospace}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translate(-50%,10px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:15px;font-weight:500;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app">
  <header id="top"></header>
  <main id="main"></main>
</div>
<nav id="tabs" aria-label="메뉴"><div class="in" id="tabsIn"></div></nav>
<div id="overlay" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---------- 설정 / 상태 ---------- */
var KEY='myrating.v1';
var TYPES=[['album','앨범'],['ep','EP'],['single','싱글'],['song','노래']];
var TL={album:'앨범',ep:'EP',single:'싱글',song:'노래'};
var items=[];
var ui={tab:'rank',type:'all',by:'artist',group:null,groupName:'',q:''};
var f=null;            // 작성 중인 폼 데이터
var overlayMode=null;  // 'detail' | 'form' | 'backup'
var openId=null;
var top3=[null,null,null];
var cloud={ready:false,user:null,db:null,auth:null,ref:null,unsub:null,state:'off',at:0,timer:null,lastRev:null,err:'',conflict:null};
var fmode='manual',cands=[],searching=false,stype='album',lastInfo='';
var VER='v6';

function load(){
  try{
    var r=localStorage.getItem(KEY);
    if(r){var d=JSON.parse(r); if(d&&Array.isArray(d.top3))top3=sanitizeTop3(d.top3); if(d&&Array.isArray(d.items)){items=d.items;var had=false;items.forEach(function(it){if('cover' in it){delete it.cover;had=true;}});if(had)save();}}
  }catch(e){}
}
function writeLocal(){localStorage.setItem(KEY,JSON.stringify({v:1,items:items,top3:top3}));}
function save(){
  try{
    writeLocal();
    localStorage.setItem('myrating.dirty','1');
    localStorage.removeItem('myrating.seedOnly');
  }catch(e){toast('저장하지 못했어요. 브라우저 저장 공간을 확인해 주세요.');return false;}
  schedulePush();
  return true;
}

/* ---------- 유틸 ---------- */
function $(s,r){return (r||document).querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmt(n){return (Math.round(Number(n)*10)/10).toFixed(1);}
/* 점수에 따라 색이 0.1점 단위로 이어서 변해요.
   차가운 남보라에서 시작해 청록, 연두, 노랑, 주황을 지나 빨강으로 오르고, 9점대에서 점점 어두워져 10점은 검정이에요. */
var COLOR_STOPS=[
  [0,[75,63,143]],[2,[90,107,214]],[4,[63,167,201]],[5,[79,191,154]],[6,[167,207,91]],
  [7,[242,201,76]],[7.6,[242,153,74]],[8.3,[240,100,74]],[9,[224,47,68]],[9.5,[142,27,48]],[10,[14,13,20]]
];
function scoreColor(sc){
  var v=Math.max(0,Math.min(10,Number(sc)||0)),a=COLOR_STOPS[0],b=COLOR_STOPS[COLOR_STOPS.length-1];
  for(var i=1;i<COLOR_STOPS.length;i++){
    if(v<=COLOR_STOPS[i][0]){a=COLOR_STOPS[i-1];b=COLOR_STOPS[i];break;}
  }
  var t=b[0]===a[0]?0:(v-a[0])/(b[0]-a[0]);
  var rgb=[0,1,2].map(function(k){return Math.round(a[1][k]+(b[1][k]-a[1][k])*t);});
  var lin=rgb.map(function(x){x/=255;return x<=0.03928?x/12.92:Math.pow((x+0.055)/1.055,2.4);});
  var lum=0.2126*lin[0]+0.7152*lin[1]+0.0722*lin[2];
  return {bg:'rgb('+rgb.join(',')+')',fg:lum>0.28?'#17162B':'#FFFFFF',dark:lum<=0.2};
}
function scStyle(sc){
  var c=scoreColor(sc);
  return 'background:'+c.bg+';color:'+c.fg+(c.dark?';--ring:rgba(255,255,255,.16);--edge:rgba(255,255,255,.28)':';--ring:rgba(23,22,43,.1);--edge:transparent');
}
function uid(){return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function norm(s){return String(s||'').trim().toLowerCase();}
var toastT;
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on');},2200);}
function avg(list){if(!list.length)return 0;return list.reduce(function(a,b){return a+Number(b.score);},0)/list.length;}
function ord(it){return it.order!=null?Number(it.order):1e13+(it.createdAt||0);}
function sortItems(list){return list.slice().sort(function(a,b){return (b.score-a.score)||(ord(a)-ord(b))||((a.createdAt||0)-(b.createdAt||0));});}
function ranked(list){
  return sortItems(list).map(function(it,i){return {it:it,rank:i+1};});
}
function uniq(field){
  var seen={},out=[];
  items.forEach(function(it){var v=(it[field]||'').trim();if(v&&!seen[norm(v)]){seen[norm(v)]=1;out.push(v);}});
  return out.sort();
}

/* ---------- 중복 확인 ---------- */
function squash(s){return norm(s).replace(/[\s'’"“”.,!?:;\-–—()\[\]·\/&]/g,'');}
function dupBase(it){return squash(it.title)+'|'+squash(it.artist);}
function dupKey(it){return dupBase(it)+'|'+it.type;}
function findDup(rec,exceptId){
  var k=dupKey(rec);
  return items.find(function(x){return x.id!==exceptId&&dupKey(x)===k;})||null;
}
function findTop3Dup(title,artist,exceptSlot){
  var b=dupBase({title:title,artist:artist});
  for(var i=0;i<3;i++){if(i!==exceptSlot&&top3[i]&&dupBase(top3[i])===b)return i;}
  return -1;
}
function dedupeItems(list){
  var map={},order=[];
  list.forEach(function(it){
    var k=dupKey(it),cur=map[k];
    if(!cur){map[k]=it;order.push(k);}
    else if((it.updatedAt||0)>(cur.updatedAt||0))map[k]=it;
  });
  return order.map(function(k){return map[k];});
}
function sanitizeTop3(arr){
  var out=[null,null,null];
  if(Array.isArray(arr)){
    for(var i=0;i<3;i++){
      var x=arr[i];
      if(x&&typeof x==='object'&&x.title)out[i]={title:String(x.title),artist:String(x.artist||''),genre:String(x.genre||''),note:String(x.note||''),updatedAt:Number(x.updatedAt)||Date.now()};
    }
  }
  return out;
}
function hasTop3(){return top3.some(function(t){return !!t;});}
function mergeTop3(a,b){
  var out=[null,null,null];
  for(var i=0;i<3;i++){
    var x=a[i],y=b[i];
    out[i]=!x?y:(!y?x:((y.updatedAt||0)>(x.updatedAt||0)?y:x));
  }
  return out;
}
function checkDup(){
  var w=$('#dupWarn');if(!w||!f)return;
  if(!f.title||!f.artist||!f.title.trim()||!f.artist.trim()){w.hidden=true;return;}
  var d=findDup({title:f.title,artist:f.artist,type:f.type},f.id);
  if(d){
    w.innerHTML='이미 레이팅한 '+TL[d.type]+'이에요 ('+fmt(d.score)+'점) <button type="button" class="linkbtn" data-action="opendup" data-id="'+d.id+'">보기</button>';
    w.hidden=false;return;
  }
  var t=findTop3Dup(f.title,f.artist,-1);
  if(t>-1){w.textContent='TOP 3의 '+(t+1)+'번 자리에 있는 앨범이에요.';w.hidden=false;return;}
  w.hidden=true;
}

/* ---------- 아이콘 ---------- */
function svg(inner,extra){return '<svg viewBox="0 0 24 24" aria-hidden="true"'+(extra||'')+'>'+inner+'</svg>';}
var IC={
  rank:svg('<path d="M5 20v-7M12 20V4M19 20v-11"/>'),
  browse:svg('<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>'),
  search:svg('<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>'),
  plus:svg('<path d="M12 5v14M5 12h14"/>'),
  back:svg('<path d="M15 5l-7 7 7 7"/>'),
  backup:svg('<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>'),
  user:svg('<circle cx="12" cy="8" r="4"/><path d="M4.5 20c1.4-4 4.2-6 7.5-6s6.100 2 7.5 6"/>'),
  close:svg('<path d="M6 6l12 12M18 6L6 18"/>')
};
var RECORD='<svg class="rec" viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="46" fill="#17162B"/><circle cx="48" cy="48" r="38" fill="none" stroke="#2f2d5c" stroke-width="1.5"/><circle cx="48" cy="48" r="31" fill="none" stroke="#2f2d5c" stroke-width="1.5"/><circle cx="48" cy="48" r="24" fill="#FFB020"/><path d="M48 36l3.5 7.4 8 1-5.9 5.6 1.5 8L48 53.9l-7.1 4.1 1.5-8-5.9-5.6 8-1z" fill="#17162B"/></svg>';

/* ---------- 목록 행 ---------- */
function row(it,rank){
  var rk=rank!=null?'<span class="rk'+(rank<=3?' top':'')+'">'+rank+'</span>':'';
  return '<button class="row'+(rank==null?' nr':'')+'" data-action="open" data-id="'+it.id+'">'+rk+
    '<span class="mt"><span class="t">'+esc(it.title)+'</span><span class="a">'+esc(it.artist)+'</span>'+
    '<span class="g"><em>'+TL[it.type]+'</em>'+esc(it.genre||'')+'</span></span>'+
    '<span class="sc" style="'+scStyle(it.score)+'" aria-label="'+fmt(it.score)+'점">'+fmt(it.score)+'</span></button>';
}
var CHEV='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
var GRIP='<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.8"/><circle cx="15" cy="6" r="1.8"/><circle cx="9" cy="12" r="1.8"/><circle cx="15" cy="12" r="1.8"/><circle cx="9" cy="18" r="1.8"/><circle cx="15" cy="18" r="1.8"/></svg>';
function rankRow(it,rank,tie){
  return '<div class="rowx" data-id="'+it.id+'" data-score="'+it.score+'">'+row(it,rank)+
    (tie?'<span class="grip" role="button" aria-label="순서 바꾸기" title="끌어서 순서 바꾸기">'+GRIP+'</span>':'<span class="gripsp"></span>')+'</div>';
}
function emptyAll(){
  return '<div class="empty">'+RECORD+'<h2>아직 레이팅이 없어요</h2><p>들은 앨범이나 노래에 점수를 남겨 보세요.</p><button class="btn" data-action="new">첫 레이팅 만들기</button></div>';
}

/* ---------- 화면: 순위 ---------- */
function viewRank(){
  var t3=top3HTML();
  if(!items.length) return t3+emptyAll();
  var chips=[['all','전체']].concat(TYPES);
  var list=ui.type==='all'?items:items.filter(function(i){return i.type===ui.type;});
  var h=t3+'<div class="chips" role="group" aria-label="종류 필터">'+chips.map(function(c){
    return '<button class="chip" data-action="type" data-v="'+c[0]+'" aria-pressed="'+(ui.type===c[0])+'">'+c[1]+'</button>';
  }).join('')+'</div>';
  if(!list.length){
    return h+'<div class="empty"><p>이 종류의 레이팅이 아직 없어요.</p><button class="btn ghost" data-action="new">새 레이팅 만들기</button></div>';
  }
  h+='<p class="stat">'+list.length+'개, 평균 '+fmt(avg(list))+'점</p>';
  var cnt={};list.forEach(function(i){cnt[i.score]=(cnt[i.score]||0)+1;});
  var hasTie=Object.keys(cnt).some(function(k){return cnt[k]>1;});
  if(hasTie)h+='<p class="hint" style="margin:0 0 4px">같은 점수끼리는 오른쪽 손잡이를 끌어서 순위를 바꿀 수 있어요.</p>';
  h+=ranked(list).map(function(r){return rankRow(r.it,r.rank,cnt[r.it.score]>1);}).join('');
  return h;
}

/* ---------- 화면: 둘러보기 ---------- */
function splitGenres(str){
  var seen={},out=[];
  String(str||'').split('/').forEach(function(p){
    var t=p.trim();
    if(t&&!seen[norm(t)]){seen[norm(t)]=1;out.push(t);}
  });
  return out;
}
// 한 항목이 속하는 분류들. 장르는 "/"로 나눠서 각각의 장르에 모두 들어가요.
function groupsOf(it,by){
  if(by==='artist')return [{key:norm(it.artist),name:(it.artist||'').trim()}];
  if(by==='genre'){
    var g=splitGenres(it.genre);
    return g.length?g.map(function(x){return {key:norm(x),name:x};}):[{key:'',name:'장르 없음'}];
  }
  return [{key:it.type,name:TL[it.type]}];
}
function inGroup(it,by,key){
  return groupsOf(it,by).some(function(g){return g.key===key;});
}

var playTried={};
function sanitizePlay(p){
  if(!p||typeof p!=='object')return null;
  var src=p.src==='sp'?'sp':(p.src==='am'?'am':null);
  if(!src)return null;
  var path=String(p.path||'');
  if(!/^(album|song|track)\/[A-Za-z0-9]+(\?i=\d+)?$/.test(path))return null;
  var cc=String(p.cc||'kr').toLowerCase();
  if(!/^[a-z]{2}$/.test(cc))cc='kr';
  return {src:src,cc:cc,path:path};
}
function parsePlayLink(u){
  u=String(u||'').trim();
  var m=u.match(/music\.apple\.com\/([a-z]{2})\/(album|song)\/(?:[^\/?#]+\/)?(\d+)(?:[^?#]*)?(?:\?[^#]*?\bi=(\d+))?/i);
  if(m)return sanitizePlay({src:'am',cc:m[1],path:m[2].toLowerCase()+'/'+m[3]+(m[2].toLowerCase()==='album'&&m[4]?'?i='+m[4]:'')});
  m=u.match(/open\.spotify\.com\/(?:intl-[a-z]+\/)?(album|track)\/([A-Za-z0-9]+)/i);
  if(m)return sanitizePlay({src:'sp',path:m[1].toLowerCase()+'/'+m[2]});
  return null;
}
function playerFrame(p,type){
  var src,h;
  if(p.src==='sp'){
    src='https://open.spotify.com/embed/'+p.path;
    h=p.path.indexOf('track/')===0?152:352;
  }else{
    src='https://embed.music.apple.com/'+p.cc+'/'+p.path;
    h=(p.path.indexOf('song/')===0||p.path.indexOf('?i=')>-1)?175:(type==='single'?260:450);
  }
  return '<iframe class="pframe" src="'+esc(src)+'" height="'+h+'" allow="autoplay *; encrypted-media *; fullscreen *; clipboard-write" sandbox="allow-forms allow-popups allow-same-origin allow-scripts allow-storage-access-by-user-activation allow-top-navigation-by-user-activation" title="음악 플레이어"></iframe>';
}

function matchResult(d,it,entity){
  var t=squash(it.title),a=squash(it.artist),res=(d&&d.results)||[];
  function nameOf(r){return entity==='song'?(r.trackName||''):String(r.collectionName||'').replace(/\s-\s*(EP|Single|싱글)$/i,'');}
  function artistOk(r){var ra=squash(r.artistName);return !!ra&&(ra===a||ra.indexOf(a)>-1||a.indexOf(ra)>-1);}
  for(var pass=0;pass<2;pass++){
    for(var i=0;i<res.length;i++){
      var r=res[i],rn=squash(nameOf(r));
      if(!r.collectionId||!rn||!artistOk(r))continue;
      if(pass===0?rn===t:(rn.indexOf(t)===0||t.indexOf(rn)===0))return r;
    }
  }
  return null;
}
function findPlay(it){
  var entity=it.type==='song'?'song':'album',term=it.title+' '+it.artist,cts=['KR','US','JP'],i=0;
  function next(){
    if(i>=cts.length)return Promise.resolve(null);
    var c=cts[i++];
    return itunes(term,entity,c).then(function(d){
      var m=matchResult(d,it,entity);
      if(m)return {src:'am',cc:c.toLowerCase(),path:'album/'+m.collectionId+(entity==='song'&&m.trackId?'?i='+m.trackId:'')};
      return next();
    },function(){return next();});
  }
  return next().catch(function(){return null;});
}
function setupPlayer(it){
  if(it.play){renderPlayer(it,'');return;}
  if(playTried[it.id]){renderPlayer(it,'miss');return;}
  renderPlayer(it,'loading');
  findPlay(it).then(function(p){
    playTried[it.id]=true;
    var cur=items.find(function(x){return x.id===it.id;});if(!cur)return;
    if(p){cur.play=sanitizePlay(p);save();}
    renderPlayer(cur,p?'':'miss');
  });
}

function jsonp(url){
  return new Promise(function(res,rej){
    var cb='__it'+Date.now()+Math.floor(Math.random()*1000),sc=document.createElement('script');
    var t=setTimeout(function(){clean();rej(new Error('timeout'));},10000);
    function clean(){clearTimeout(t);try{delete window[cb];}catch(e){window[cb]=undefined;}if(sc.parentNode)sc.parentNode.removeChild(sc);}
    window[cb]=function(d){clean();res(d);};
    sc.onerror=function(){clean();rej(new Error('net'));};
    sc.src=url+'&callback='+cb;document.head.appendChild(sc);
  });
}
function itunes(term,entity,country,attr){
  var url='https://itunes.apple.com/search?limit=25&country='+country+'&entity='+entity+(attr?'&attribute='+attr:'')+'&term='+encodeURIComponent(term);
  return fetch(url).then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json();}).then(function(d){if(d&&typeof d==='object')d._via='fetch';return d;}).catch(function(e){return jsonp(url).then(function(d){if(d&&typeof d==='object'){d._via='jsonp';d._why=String((e&&e.message)||e);}return d;});});
}
function mapResults(d,entity){
  var out=[],seen={};
  ((d&&d.results)||[]).forEach(function(r){
    var c;
    if(entity==='album'){
      if(!r.collectionName)return;
      var title=r.collectionName,type='album';
      if(/\s-\s*EP$/i.test(title)){type='ep';title=title.replace(/\s-\s*EP$/i,'');}
      else if(/\s-\s*(Single|싱글)$/i.test(title)){type='single';title=title.replace(/\s-\s*(Single|싱글)$/i,'');}
      c={type:type,title:title,artist:r.artistName||'',genre:r.primaryGenreName||'',year:(r.releaseDate||'').slice(0,4),album:''};
    }else{
      if(!r.trackName)return;
      c={type:'song',title:r.trackName,artist:r.artistName||'',genre:r.primaryGenreName||'',year:(r.releaseDate||'').slice(0,4),
         album:(r.collectionName||'').replace(/\s-\s*(EP|Single|싱글)$/i,'')};
    }
    c.cid=r.collectionId||null;c.tid=r.trackId||null;
    var k=norm(c.title+'|'+c.artist+'|'+c.type);
    if(seen[k])return;seen[k]=1;out.push(c);
  });
  return out;
}
function renderCands(){
  var box=$('#cands');if(!box)return;
  if(!cands.length){box.innerHTML='<p class="hint">결과가 없어요. 아티스트 이름과 함께 영어로 검색해 보세요. (예: frank ocean blonde) 그래도 없으면 직접 입력해 주세요.</p><p class="hint" style="font-size:13px;word-break:break-all">진단: '+esc(lastInfo||'-')+' ('+VER+')</p>';return;}
  box.innerHTML=cands.map(function(c,i){
    var meta=[TL[c.type],c.year,c.genre].filter(Boolean).join(', ');
    var dd=findDup(c,null);
    return '<button type="button" class="cand" data-action="pick" data-i="'+i+'">'+(dd?'<span class="s" style="color:var(--danger);font-weight:700">이미 레이팅함 ('+fmt(dd.score)+'점)</span>':'')+'<span class="t">'+esc(c.title)+'</span><span class="s">'+esc(c.artist)+(c.type==='song'&&c.album?', '+esc(c.album):'')+'</span><span class="s">'+esc(meta)+'</span></button>';
  }).join('');
}
function runSearch(){
  var inp=$('#sq'),q=inp?inp.value.trim():'';
  if(!q){toast('검색어를 입력해 주세요');return;}
  if(searching)return;
  searching=true;cands=[];
  var box=$('#cands');if(box)box.innerHTML='<p class="hint">찾는 중…</p>';
  var entity=stype==='song'?'song':'album';
  var info=[];
  function cnt(d){return ((d&&d.results&&d.results.length)||0)+'건'+(d&&d._via?' via '+d._via:'')+(d&&d._why?' (fetch 실패: '+d._why+')':'')+(d&&d.errorMessage?' ['+d.errorMessage+']':'');}
  var variants=[q];
  var latin=q.split(/\s+/).filter(function(t){return !/[\u3131-\u318E\uAC00-\uD7A3]/.test(t);}).join(' ').trim();
  if(latin&&latin!==q)variants.push(latin);
  var qt=norm(variants[variants.length-1]).split(/\s+/);
  function relevance(c){
    var hay=norm(c.title+' '+c.artist+' '+(c.album||''));
    return qt.filter(function(t){return hay.indexOf(t)>-1;}).length;
  }
  function hasFull(list){return list.some(function(c){return relevance(c)===qt.length;});}
  // 한국·미국·일본 스토어를 함께 검색해요 (스토어마다 올라와 있는 앨범이 달라서)
  function round(term,attr){
    return Promise.all(['KR','US','JP'].map(function(c){
      return itunes(term,entity,c,attr).then(function(d){
        info.push(c+(attr?'/제목':'')+' '+cnt(d));
        return mapResults(d,entity).map(function(x){x.cc=c.toLowerCase();return x;});
      },function(){info.push(c+' 오류');return [];});
    })).then(function(arrs){return [].concat.apply([],arrs);});
  }
  var acc=[];
  round(variants[0]).then(function(r){
    acc=r;
    if(!hasFull(acc)&&variants.length>1)return round(variants[1]).then(function(r2){acc=acc.concat(r2);});
  }).then(function(){
    if(!hasFull(acc))return round(variants[variants.length-1],entity==='song'?'songTerm':'albumTerm').then(function(r3){acc=acc.concat(r3);});
  }).then(function(){
    var seen={},r=[];
    acc.forEach(function(c){var k=norm(c.title+'|'+c.artist+'|'+c.type);if(seen[k])return;seen[k]=1;r.push(c);});
    r=r.map(function(c,i){return {c:c,i:i,s:relevance(c)};}).sort(function(a,b){return (b.s-a.s)||(a.i-b.i);}).slice(0,20).map(function(x){return x.c;});
    cands=r;lastInfo=info.join(', ');renderCands();
  }).catch(function(err){
    var b=$('#cands');if(b)b.innerHTML='<p class="hint">검색하지 못했어요. 인터넷 연결을 확인하거나 직접 입력해 주세요.</p><p class="hint" style="font-size:13px;word-break:break-all">진단: '+esc((err&&err.message)||'오류')+' ('+VER+')</p>';
  }).then(function(){searching=false;});
}
function pickCand(i){
  var c=cands[i];if(!c||!f)return;
  var dd=findDup(c,null);
  if(dd){closeOverlay();openDetail(dd.id);toast('이미 레이팅한 앨범이에요');return;}
  f.title=c.title;f.artist=c.artist;f.genre=c.genre||'';f.album=c.type==='song'?(c.album||''):'';
  f.play=c.cid?{src:'am',cc:c.cc||'kr',path:'album/'+c.cid+(c.type==='song'&&c.tid?'?i='+c.tid:'')}:null;
  [['f-title',f.title],['f-artist',f.artist],['f-genre',f.genre],['f-album',f.album]].forEach(function(p){var el=$('#'+p[0]);if(el)el.value=p[1];});
  applyType(c.type);
  fmode='manual';renderMode();checkDup();
  var ov=$('#overlay');if(ov)ov.scrollTop=0;
  toast('자동으로 입력했어요. 내용을 확인해 주세요');
}
function setScore(v){
  v=Math.max(0,Math.min(10,Math.round(Number(v)*10)/10));
  f.score=v;
  var n=$('#scoreNum'),r=$('#scoreRange');
  if(n){n.textContent=fmt(v);var c=scoreColor(v);n.style.cssText=scStyle(v);}
  if(r)r.style.accentColor=scoreColor(v).bg;
  if(r)r.value=v;
}
function saveForm(){
  if(!f.title.trim()){toast('제목을 입력해 주세요');var t=$('#f-title');if(t)t.focus();return;}
  if(!f.artist.trim()){toast('아티스트를 입력해 주세요');var a=$('#f-artist');if(a)a.focus();return;}
  var dupe=findDup({title:f.title,artist:f.artist,type:f.type},f.id);
  if(dupe){toast('이미 레이팅한 앨범이에요 ('+fmt(dupe.score)+'점)');checkDup();return;}
  if(findTop3Dup(f.title,f.artist,-1)>-1){toast('TOP 3에 있는 앨범은 레이팅하지 않아요');checkDup();return;}
  var now=Date.now();
  var old=f.id?items.find(function(x){return x.id===f.id;}):null;
  var rec={
    id:f.id||uid(),type:f.type,title:f.title.trim(),artist:f.artist.trim(),genre:(f.genre||'').trim(),
    album:f.type==='song'?(f.album||'').trim():'',score:f.score,note:(f.note||'').trim(),
    createdAt:f.createdAt||now,updatedAt:now,
    order:(old&&old.score===f.score&&old.order!=null)?old.order:null,
    play:sanitizePlay(f.play)
  };
  if(old&&rec.play&&old.play&&JSON.stringify(rec.play)===JSON.stringify(old.play)&&dupBase(old)!==dupBase(rec))rec.play=null;
  var idx=items.findIndex(function(x){return x.id===rec.id;});
  var backup=items.slice();
  if(idx>-1)items[idx]=rec;else items.push(rec);
  if(!save()){items=backup;return;}
  var wasEdit=idx>-1;
  closeOverlay();render();
  toast(wasEdit?'수정했어요':'저장했어요');
  openDetail(rec.id);
}

    '<div class="actions"><button class="btn ghost" data-action="copy">복사하기</button><button class="btn ghost" data-action="restore" id="restoreBtn">이 내용으로 복원</button></div>'+

    'backup');

function doRestore(){
  var raw=$('#bk').value.trim(),d;
  try{d=JSON.parse(raw);}catch(e){toast('백업 내용을 읽을 수 없어요');return;}
  var arr=Array.isArray(d)?d:(d&&d.items);
  if(!Array.isArray(arr)){toast('백업 내용을 읽을 수 없어요');return;}
  var out=sanitizeItems(arr);
  var t3=(d&&Array.isArray(d.top3))?sanitizeTop3(d.top3):null;
  var prev=items,prevT=top3;items=out;if(t3)top3=t3;
  if(!save()){items=prev;top3=prevT;return;}
  closeOverlay();render();toast(out.length+'개의 레이팅을 복원했어요');
}

/* ---------- 이벤트 ---------- */
var armed={};
function arm(btn,key,armedText,onConfirm){
  if(armed[key]){clearTimeout(armed[key].t);var orig=armed[key];armed[key]=null;onConfirm();return;}
  var orig=btn.textContent;
  btn.textContent=armedText;btn.classList.add('danger');btn.classList.remove('ghost');
  armed[key]={t:setTimeout(function(){armed[key]=null;btn.textContent=orig;btn.classList.remove('danger');btn.classList.add('ghost');},3500)};
}

document.addEventListener('click',function(e){
  if(!e.target.closest('.combo'))hideCombos();
  var el=e.target.closest('[data-action]');
  if(!el)return;
  var a=el.dataset.action,v=el.dataset.v;
  if(a==='tab'){ui.tab=v;ui.group=null;render();window.scrollTo(0,0);if(v==='search'){var q=$('#q');if(q&&!ui.q)q.focus();}}
  else if(a==='new'){openForm(null);}
  else if(a==='type'){ui.type=v;render();}
  else if(a==='by'){ui.by=v;ui.group=null;render();}
  else if(a==='group'){ui.group=el.dataset.key;ui.groupName=el.dataset.name;render();window.scrollTo(0,0);}
  else if(a==='back'){ui.group=null;render();}
  else if(a==='open'){openDetail(el.dataset.id);}
  else if(a==='close'){closeOverlay();}
  else if(a==='edit'){openForm(el.dataset.id);}
  else if(a==='del'){
    var id=el.dataset.id;
    arm(el,'del','정말 삭제할까요? 한 번 더 누르세요',function(){
      var prev=items;items=items.filter(function(x){return x.id!==id;});
      if(!save()){items=prev;return;}
      closeOverlay();render();toast('삭제했어요');
    });
  }
  else if(a==='combo-toggle'){
    var cb=$('#cl-'+el.dataset.field);
    if(cb&&!cb.hidden)hideCombos();else showCombo(el.dataset.field,true);
  }
  else if(a==='combo-pick'){
    var fld=el.dataset.field,ci=$('#f-'+fld);
    var nv=(el.dataset.prefix||'')+el.dataset.val;
    if(ci){ci.value=nv;}
    if(f)f[fld]=nv;
    hideCombos();
  }
  else if(a==='t3edit'){openTop3(Number(el.dataset.i));}
  else if(a==='t3save'){saveTop3();}
  else if(a==='t3clear'){
    var si=f?f.slot:null;
    arm(el,'t3clear','정말 비울까요? 한 번 더 누르세요',function(){
      if(si==null)return;
      var prev=top3.slice();top3[si]=null;
      if(!save()){top3=prev;return;}
      closeOverlay();render();toast('자리를 비웠어요');
    });
  }
  else if(a==='dedupe'){
    arm(el,'dedupe','정말 정리할까요? 한 번 더 누르세요',function(){
      var prev=items;items=dedupeItems(items);
      if(!save()){items=prev;return;}
      closeOverlay();render();toast((prev.length-items.length)+'개의 중복을 정리했어요');
    });
  }
  else if(a==='plink'){var pc=items.find(function(x){return x.id===el.dataset.id;});if(pc)renderPlayer(pc,'edit');}
  else if(a==='plinkdel'){
    var pd=items.find(function(x){return x.id===el.dataset.id;});
    if(pd){pd.play=null;delete playTried[pd.id];save();setupPlayer(pd);}
  }
  else if(a==='plinksave'){
    var ps=items.find(function(x){return x.id===el.dataset.id;}),pin=$('#plinkIn');
    var np=parsePlayLink(pin?pin.value:'');
    if(!np){toast('Apple Music이나 Spotify의 앨범·곡 링크를 넣어 주세요');return;}
    if(ps){ps.play=np;save();renderPlayer(ps,'');toast('재생 링크를 저장했어요');}
  }
  else if(a==='opendup'){closeOverlay();openDetail(el.dataset.id);}
  else if(a==='ftype'){
    applyType(v);checkDup();
  }
  else if(a==='fmode'){fmode=v;renderMode();setTimeout(function(){var t=$(v==='search'?'#sq':'#f-title');if(t)t.focus();},50);}
  else if(a==='dosearch'){runSearch();}
  else if(a==='stype'){stype=v;document.querySelectorAll('#stypes .chip').forEach(function(c){c.setAttribute('aria-pressed',String(c.dataset.v===v));});var q0=$('#sq');if(q0&&q0.value.trim())runSearch();}
  else if(a==='pick'){pickCand(Number(el.dataset.i));}
  else if(a==='step'){setScore(f.score+Number(v));}
  else if(a==='savef'){saveForm();}
  else if(a==='backup'){openBackup();}
  else if(a==='account'){showAccount(false);}
  else if(a==='login'||a==='signup'){accAuth(a);}
  else if(a==='reset'){accReset();}
  else if(a==='logout'){
    if(cloud.auth)cloud.auth.signOut().then(function(){toast('로그아웃했어요. 이 기기의 레이팅은 그대로 남아 있어요');});
  }
  else if(a==='syncnow'){
    if(cloud.ref){cloud.state='saving';refreshAccountUI();cloud.ref.get().then(firstSync).catch(cloudFail);}
  }
  else if(a==='keep-cloud'||a==='keep-local'||a==='keep-merge'){resolveConflict(a);}
  else if(a==='copy'){
    var ta=$('#bk');
    ta.focus();ta.select();
    var ok=false;
    try{ok=document.execCommand('copy');}catch(err){}
    if(!ok&&navigator.clipboard){navigator.clipboard.writeText(ta.value).then(function(){toast('복사했어요');},function(){toast('길게 눌러 직접 복사해 주세요');});return;}
    toast(ok?'복사했어요':'길게 눌러 직접 복사해 주세요');
  }
  else if(a==='restore'){
    arm(el,'restore','정말 덮어쓸까요? 한 번 더 누르세요',doRestore);
  }
});

/* ---------- 로그인과 클라우드 저장 (Firebase) ---------- */
function cloudEnabled(){return !!(window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.apiKey&&window.FIREBASE_CONFIG.projectId);}
function loadScript(src){
  return new Promise(function(res,rej){
    var sc=document.createElement('script');sc.src=src;sc.onload=res;
    sc.onerror=function(){rej(new Error('load'));};document.head.appendChild(sc);
  });
}
function sanitizeItems(arr){
  var out=[];
  (arr||[]).forEach(function(x){
    if(!x||typeof x!=='object'||!x.title)return;
    var sc=Number(x.score);if(isNaN(sc))sc=0;
    out.push({
      id:String(x.id||uid()),type:TL[x.type]?x.type:'album',title:String(x.title),artist:String(x.artist||'알 수 없음'),
      genre:String(x.genre||''),album:String(x.album||''),score:Math.max(0,Math.min(10,Math.round(sc*10)/10)),
      note:String(x.note||''),createdAt:Number(x.createdAt)||Date.now(),updatedAt:Number(x.updatedAt)||Date.now(),
      order:(x.order!=null&&!isNaN(Number(x.order)))?Number(x.order):null,
      play:sanitizePlay(x.play)
    });
  });
  return dedupeItems(out);
}
function parseRemote(str){
  try{var d=JSON.parse(str);var arr=Array.isArray(d)?d:(d&&d.items);if(!Array.isArray(arr))return null;return {items:sanitizeItems(arr),top3:sanitizeTop3(d&&d.top3)};}catch(e){return null;}
}
function readSyncInfo(){try{return JSON.parse(localStorage.getItem('myrating.sync')||'null');}catch(e){return null;}}
function writeSyncInfo(rev){try{localStorage.setItem('myrating.sync',JSON.stringify({uid:cloud.user&&cloud.user.uid,rev:rev}));}catch(e){}}
function errText(e){
  var c=(e&&e.code)||'';
  if(c==='permission-denied')return '저장 권한이 없어요. Firestore 규칙을 확인해 주세요.';
  if(c==='unavailable')return '서버에 연결하지 못했어요.';
  return c||'알 수 없는 오류';
}
function authMsg(e){
  var c=(e&&e.code)||'';
  if(c==='auth/invalid-email')return '이메일 형식이 올바르지 않아요.';
  if(c==='auth/missing-password'||c==='auth/weak-password')return '비밀번호는 6자 이상이어야 해요.';
  if(c==='auth/email-already-in-use')return '이미 가입된 이메일이에요. 로그인해 주세요.';
  if(c==='auth/user-not-found'||c==='auth/wrong-password'||c==='auth/invalid-credential'||c==='auth/invalid-login-credentials')return '이메일이나 비밀번호가 맞지 않아요.';
  if(c==='auth/too-many-requests')return '시도가 너무 많아요. 잠시 뒤에 다시 해 주세요.';
  if(c==='auth/network-request-failed')return '인터넷 연결을 확인해 주세요.';
  if(c==='auth/operation-not-allowed')return 'Firebase에서 이메일/비밀번호 로그인이 켜져 있지 않아요.';
  if(c==='auth/missing-email')return '이메일을 입력해 주세요.';
  return '문제가 생겼어요. ('+(c||'알 수 없음')+')';
}
function updateDot(){
  var d=$('#sdot');if(!d)return;
  d.hidden=!cloud.user;
  d.className='sdot s-'+(cloud.user?cloud.state:'off');
}
function refreshAccountUI(){
  updateDot();
  if(overlayMode==='account')showAccount(true);
}
function initCloud(){
  if(!cloudEnabled())return;
  var base='https://www.gstatic.com/firebasejs/10.12.2/';
  loadScript(base+'firebase-app-compat.js')
    .then(function(){return loadScript(base+'firebase-auth-compat.js');})
    .then(function(){return loadScript(base+'firebase-firestore-compat.js');})
    .then(function(){
      firebase.initializeApp(window.FIREBASE_CONFIG);
      cloud.auth=firebase.auth();cloud.db=firebase.firestore();cloud.ready=true;
      cloud.auth.onAuthStateChanged(onAuth);
      refreshAccountUI();
    })
    .catch(function(){cloud.state='offline';refreshAccountUI();});
  window.addEventListener('online',function(){
    if(cloud.user&&localStorage.getItem('myrating.dirty')==='1')pushNow();
  });
}
function cloudFail(e){cloud.state=navigator.onLine?'error':'offline';cloud.err=errText(e);refreshAccountUI();}
function onAuth(user){
  if(cloud.unsub){cloud.unsub();cloud.unsub=null;}
  cloud.user=user||null;cloud.conflict=null;
  if(!user){cloud.state='off';cloud.ref=null;refreshAccountUI();return;}
  cloud.ref=cloud.db.collection('users').doc(user.uid);
  cloud.state='saving';refreshAccountUI();
  cloud.ref.get().then(firstSync).catch(cloudFail);
}
function firstSync(snap){
  var info=readSyncInfo();
  var dirty=localStorage.getItem('myrating.dirty')==='1'||!info;
  var seedOnly=localStorage.getItem('myrating.seedOnly')==='1';
  if(!snap.exists){pushNow().then(listen);return;}
  var d=snap.data(),remote=parseRemote(d.data);
  if(!remote){cloud.state='error';cloud.err='클라우드 데이터를 읽을 수 없어요.';refreshAccountUI();return;}
  var mine=info&&info.uid===cloud.user.uid;
  if(mine&&info.rev===d.rev){
    if(localStorage.getItem('myrating.dirty')==='1')pushNow();else{cloud.state='idle';cloud.at=cloud.at||Date.now();refreshAccountUI();}
    listen();return;
  }
  if((items.length===0&&!hasTop3())||seedOnly||(mine&&!dirty)){applyRemote(remote,d.rev);listen();return;}
  cloud.conflict={remote:remote,rev:d.rev};
  cloud.state='saving';
  showOverlay(conflictHTML(remote),'conflict');
}
function applyRemote(remote,rev){
  items=remote.items;top3=remote.top3;
  try{writeLocal();localStorage.removeItem('myrating.dirty');localStorage.removeItem('myrating.seedOnly');}catch(e){}
  writeSyncInfo(rev);cloud.lastRev=rev;cloud.state='idle';cloud.at=Date.now();
  render();refreshAccountUI();
}
function pushNow(){
  if(!cloud.user||!cloud.ref||cloud.conflict)return Promise.resolve();
  clearTimeout(cloud.timer);
  var rev=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  cloud.lastRev=rev;cloud.state='saving';refreshAccountUI();
  return cloud.ref.set({data:JSON.stringify({v:1,items:items,top3:top3}),rev:rev,updatedAt:Date.now()}).then(function(){
    writeSyncInfo(rev);
    if(cloud.lastRev===rev)localStorage.removeItem('myrating.dirty');
    cloud.state='idle';cloud.at=Date.now();refreshAccountUI();
  }).catch(cloudFail);
}
function schedulePush(){
  if(!cloud||!cloud.user||!cloud.ref||cloud.conflict)return;
  clearTimeout(cloud.timer);
  cloud.state='saving';updateDot();
  cloud.timer=setTimeout(pushNow,900);
}
function listen(){
  if(!cloud.ref)return;
  if(cloud.unsub)cloud.unsub();
  cloud.unsub=cloud.ref.onSnapshot(function(snap){
    if(snap.metadata.hasPendingWrites||!snap.exists)return;
    var d=snap.data(),info=readSyncInfo();
    if(d.rev===cloud.lastRev||(info&&info.rev===d.rev))return;
    if(localStorage.getItem('myrating.dirty')==='1')return;
    var remote=parseRemote(d.data);
    if(remote){applyRemote(remote,d.rev);toast('다른 기기에서 바꾼 내용을 불러왔어요');}
  },function(){});
}
function mergeItems(a,b){
  var byId={};
  a.concat(b).forEach(function(it){
    var cur=byId[it.id];
    if(!cur||(it.updatedAt||0)>(cur.updatedAt||0))byId[it.id]=it;
  });
  var byKey={},out=[];
  Object.keys(byId).forEach(function(id){
    var it=byId[id],k=dupKey(it),cur=byKey[k];
    if(!cur||(it.updatedAt||0)>(cur.updatedAt||0))byKey[k]=it;
  });
  Object.keys(byKey).forEach(function(k){out.push(byKey[k]);});
  return out;
}
function conflictHTML(remote){
  return '<div class="sheet"><div class="sheet-top"><span></span><h2>어느 쪽을 쓸까요?</h2><span></span></div>'+
    '<p class="hint" style="margin-top:0">이 기기와 클라우드에 서로 다른 레이팅이 있어요.<br>이 기기 '+items.length+'개, 클라우드 '+remote.items.length+'개</p>'+
    '<div style="display:grid;gap:10px;margin-top:14px">'+
    '<button class="btn" data-action="keep-merge">둘 다 합치기 (추천)</button>'+
    '<button class="btn ghost" data-action="keep-cloud">클라우드 내용으로 바꾸기<br><small>이 기기의 내용은 사라져요</small></button>'+
    '<button class="btn ghost" data-action="keep-local">이 기기 내용으로 덮어쓰기<br><small>클라우드의 내용은 사라져요</small></button></div>'+
    '<p class="hint">합치면 같은 앨범은 더 최근에 고친 쪽이 남아요.</p></div>';
}
function resolveConflict(a){
  var c=cloud.conflict;if(!c)return;
  cloud.conflict=null;
  if(a==='keep-cloud'){applyRemote(c.remote,c.rev);}
  else if(a==='keep-merge'){
    items=mergeItems(items,c.remote.items);top3=mergeTop3(top3,c.remote.top3);
    try{writeLocal();localStorage.setItem('myrating.dirty','1');localStorage.removeItem('myrating.seedOnly');}catch(e){}
    render();pushNow();
  }else{pushNow();}
  listen();
  closeOverlay();
  toast('정리했어요');
}
function timeStr(t){var d=new Date(t);return (d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes();}
function statusText(){
  if(cloud.state==='saving')return navigator.onLine?'저장 중…':'오프라인이에요. 연결되면 자동으로 올라가요.';
  if(cloud.state==='error')return '저장하지 못했어요. '+(cloud.err||'');
  if(cloud.state==='idle'&&cloud.at)return '클라우드에 저장됨 ('+timeStr(cloud.at)+')';
  return '동기화 준비됨';
}

  if(!cloudEnabled()){
    h+='<p>클라우드 저장은 아직 꺼져 있어요.</p><p class="hint">GitHub 저장소의 <b>firebase-config.js</b> 파일에 Firebase 설정값을 붙여넣으면 로그인과 클라우드 저장을 쓸 수 있어요. 그 전까지는 이 기기에만 저장돼요.</p>';

      '<p class="hint" id="acc-err" style="color:var(--danger);min-height:1.4em;margin:0 0 10px"></p>'+

      '<p style="margin:16px 0 0"><button type="button" class="mini" data-action="reset">비밀번호 재설정 메일 받기</button></p>';

      '<p class="hint">레이팅을 바꾸면 자동으로 클라우드에 저장돼요. 로그아웃해도 이 기기의 레이팅은 그대로 남아 있어요.</p>';

function showAccount(keep){

/* ---------- TOP 3: 점수로 매길 수 없는 앨범 ---------- */
function top3HTML(){
  var h='<section class="t3" aria-label="TOP 3"><h2>TOP 3</h2><p class="sub">점수로 매길 수 없는 앨범</p>';
  for(var i=0;i<3;i++){
    var t=top3[i];
    h+='<button class="t3row'+(t?'':' t3empty')+'" data-action="t3edit" data-i="'+i+'"><span class="t3n">'+(i+1)+'</span><span class="t3m">'+
      (t?'<span class="t3t">'+esc(t.title)+'</span><span class="t3a">'+esc(t.artist)+(t.genre?', '+esc(t.genre):'')+'</span>'+(t.note?'<span class="t3note">'+esc(t.note)+'</span>':'')
        :'<span class="t3t">자리가 비어 있어요</span><span class="t3a">눌러서 앨범 추가하기</span>')+'</span></button>';
  }
  return h+'</section>';
}
function openTop3(i){
  var t=top3[i];
  f=t?{title:t.title,artist:t.artist,genre:t.genre,note:t.note,slot:i}:{title:'',artist:'',genre:'',note:'',slot:i};
  var chev=CHEV;
  showOverlay(
    '<div class="sheet"><div class="sheet-top"><button class="ib" data-action="close" aria-label="닫기">'+IC.close+'</button><h2>TOP 3, '+(i+1)+'번 자리</h2><span style="width:24px"></span></div>'+
    '<p class="hint" style="margin-top:0">점수를 매기지 않고 따로 모셔 두는 앨범이에요.</p>'+
    '<div class="field"><label for="f-title">앨범 제목</label><input class="in-t" id="f-title" data-f="title" value="'+esc(f.title)+'" placeholder="앨범 제목" autocomplete="off"></div>'+
    '<div class="field"><label for="f-artist">아티스트</label><div class="combo"><input class="in-t" id="f-artist" data-f="artist" data-combo="artist" value="'+esc(f.artist)+'" placeholder="직접 입력하거나 목록에서 선택" autocomplete="off"><button type="button" class="combo-btn" data-action="combo-toggle" data-field="artist" aria-label="아티스트 목록 열기">'+chev+'</button><div class="combo-list" id="cl-artist" hidden></div></div></div>'+
    '<div class="field"><label for="f-genre">장르</label><div class="combo"><input class="in-t" id="f-genre" data-f="genre" data-combo="genre" value="'+esc(f.genre)+'" placeholder="직접 입력하거나 목록에서 선택" autocomplete="off"><button type="button" class="combo-btn" data-action="combo-toggle" data-field="genre" aria-label="장르 목록 열기">'+chev+'</button><div class="combo-list" id="cl-genre" hidden></div></div></div>'+
    '<div class="field"><label for="f-note">이 앨범이 특별한 이유</label><textarea class="in-t" id="f-note" data-f="note" placeholder="한두 줄로 적어 보세요">'+esc(f.note)+'</textarea></div>'+
    '<div class="savebar"><button class="btn block" data-action="t3save">저장하기</button>'+
    (t?'<button class="btn ghost block" data-action="t3clear" style="margin-top:10px">이 자리 비우기</button>':'')+'</div></div>',
    'top3');
  if(!t)setTimeout(function(){var el=$('#f-title');if(el)el.focus();},250);
}
function saveTop3(){
  if(!f||f.slot==null)return;
  if(!f.title.trim()){toast('앨범 제목을 입력해 주세요');var el=$('#f-title');if(el)el.focus();return;}
  var tmp={title:f.title,artist:f.artist||''};
  var other=findTop3Dup(tmp.title,tmp.artist,f.slot);
  if(other>-1){toast('TOP 3의 '+(other+1)+'번 자리에 이미 있어요');return;}
  var b=dupBase(tmp);
  var rated=items.find(function(x){return dupBase(x)===b;});
  if(rated){toast('이미 레이팅한 앨범이에요. 레이팅을 지운 뒤 올려 주세요');return;}
  var prev=top3.slice();
  top3[f.slot]={title:f.title.trim(),artist:(f.artist||'').trim(),genre:(f.genre||'').trim(),note:(f.note||'').trim(),updatedAt:Date.now()};
  if(!save()){top3=prev;return;}
  closeOverlay();render();toast('TOP 3에 올렸어요');
}

/* ---------- 아티스트·장르: 직접 입력도 되고 목록에서 고를 수도 있어요 ---------- */
var DEFAULT_GENRES=['Hip-Hop','R&B','Soul','Pop','Rock','Electronic','Jazz','Funk','Indie','Alternative','Folk','Country','Classical','Metal','Heavy Metal','Punk','Reggae','Blues','Gospel','Disco','House','Ambient','Synth-Pop','Art Pop','Psychedelic Pop','Progressive Rock','Grunge','J-Pop','J-Rock','K-Pop','Latin','Soundtrack'];
function comboSource(field){
  var cnt={},label={};
  function add(v){var k=norm(v);if(!k)return;if(!label[k])label[k]=String(v).trim();cnt[k]=(cnt[k]||0)+1;}
  items.forEach(function(it){
    if(field==='artist')add(it.artist||'');
    else splitGenres(it.genre).forEach(add);
  });
  if(field==='genre')DEFAULT_GENRES.forEach(function(g){var k=norm(g);if(!label[k]){label[k]=g;cnt[k]=0;}});
  return Object.keys(label).map(function(k){return {key:k,name:label[k],n:cnt[k]};}).sort(function(a,b){return (b.n-a.n)||a.name.localeCompare(b.name,'ko');});
}
function hideCombos(){
  document.querySelectorAll('.combo-list').forEach(function(b){b.hidden=true;});
}
function showCombo(field,all){
  var inp=$('#f-'+field),box=$('#cl-'+field);
  if(!inp||!box)return;
  hideCombos();
  var val=inp.value,prefix='',token=val;
  if(field==='genre'){
    var p=val.lastIndexOf('/');
    prefix=p>-1?val.slice(0,p+1):'';
    token=p>-1?val.slice(p+1):val;
  }
  var q=norm(token),chosen={};
  if(field==='genre')splitGenres(prefix).forEach(function(g){chosen[norm(g)]=1;});
  var list=comboSource(field).filter(function(o){return !chosen[o.key];});
  if(!all&&q){
    list=list.filter(function(o){return o.key.indexOf(q)>-1;}).sort(function(a,b){
      var as=a.key.indexOf(q)===0?0:1,bs=b.key.indexOf(q)===0?0:1;
      return (as-bs)||(b.n-a.n);
    });
  }
  list=list.slice(0,60);
  if(!list.length){
    box.innerHTML='<p class="hint" style="padding:10px 14px;margin:0">일치하는 항목이 없어요. 그대로 입력하면 새로 추가돼요.</p>';
  }else{
    box.innerHTML=list.map(function(o){
      return '<button type="button" class="opt" data-action="combo-pick" data-field="'+field+'" data-val="'+esc(o.name)+'" data-prefix="'+esc(prefix)+'"><span>'+esc(o.name)+'</span>'+(o.n?'<span class="c">'+o.n+'개</span>':'')+'</button>';
    }).join('');
  }
  box.hidden=false;
}

/* ---------- 같은 점수 안에서 끌어서 순위 바꾸기 ---------- */
var drag=null;
function groupRows(){
  return [].slice.call(document.querySelectorAll('.rowx[data-score="'+drag.score+'"]'));
}
function reorderCheck(){
  if(!drag)return;
  var rows=groupRows(),me=drag.row,y=drag.y;
  for(var k=0;k<rows.length;k++){
    var r=rows[k];if(r===me)continue;
    var b=r.getBoundingClientRect(),mid=b.top+b.height/2;
    var above=!!(r.compareDocumentPosition(me)&Node.DOCUMENT_POSITION_FOLLOWING);
    if(above&&y<mid){r.parentNode.insertBefore(me,r);return;}
    if(!above&&y>mid){r.parentNode.insertBefore(me,r.nextSibling);return;}
  }
}
function commitOrder(scoreStr,ids){
  var sc=Number(scoreStr);
  var gg=sortItems(items.filter(function(i){return i.score===sc;}));
  var inSet={};ids.forEach(function(id){inSet[id]=1;});
  var byId={};items.forEach(function(i){byId[i.id]=i;});
  var seq=gg.slice(),k=0;
  gg.forEach(function(it,i){if(inSet[it.id]){seq[i]=byId[ids[k++]];}});
  var snap=gg.map(function(i){return [i,i.order];});
  seq.forEach(function(it,i){it.order=i;});
  if(!save()){snap.forEach(function(p){p[0].order=p[1];});}
}
function endDrag(commit){
  if(!drag)return;
  var d=drag;drag=null;
  clearInterval(d.tm);
  document.body.style.userSelect='';
  d.row.classList.remove('dragging');
  if(commit){
    var ids=[].slice.call(document.querySelectorAll('.rowx[data-score="'+d.score+'"]')).map(function(r){return r.dataset.id;});
    var before=sortItems(items.filter(function(i){return i.score===Number(d.score);})).map(function(i){return i.id;});
    var changed=ids.some(function(id,i){return id!==before.filter(function(b){return ids.indexOf(b)>-1;})[i];});
    if(changed){commitOrder(d.score,ids);toast('순위를 바꿨어요');}
  }
  render();
}
document.addEventListener('pointerdown',function(e){
  var g=e.target.closest&&e.target.closest('.grip');
  if(!g||drag)return;
  var row=g.closest('.rowx');if(!row)return;
  e.preventDefault();
  drag={row:row,score:row.dataset.score,pid:e.pointerId,y:e.clientY,g:g};
  row.classList.add('dragging');
  try{g.setPointerCapture(e.pointerId);}catch(err){}
  document.body.style.userSelect='none';
  drag.tm=setInterval(function(){
    if(!drag)return;
    var h=window.innerHeight;
    if(drag.y<110)window.scrollBy(0,-14);
    else if(drag.y>h-150)window.scrollBy(0,14);
    reorderCheck();
  },30);
});
document.addEventListener('pointermove',function(e){
  if(!drag||e.pointerId!==drag.pid)return;
  e.preventDefault();
  drag.y=e.clientY;
  reorderCheck();
},{passive:false});
document.addEventListener('pointerup',function(e){if(drag&&e.pointerId===drag.pid)endDrag(true);});
document.addEventListener('pointercancel',function(e){if(drag&&e.pointerId===drag.pid)endDrag(false);});
document.addEventListener('contextmenu',function(e){if(e.target.closest&&e.target.closest('.grip'))e.preventDefault();});

load();
render();
window.addEventListener('scroll',function(){var t=$('#top');if(t)t.classList.toggle('scrolled',window.scrollY>4);},{passive:true});
initCloud();

})();
