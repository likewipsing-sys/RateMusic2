<title>코토바 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a study notebook. One column (max 720px), bottom tab bar, characters always shown inside 田字格 practice squares. */
:root{
  --paper:#F3F5F8; --surface:#FFFFFF; --ink:#1C2740; --ink-soft:#5B6579; --line:#D7DDE8; --grid:#C9D3E6;
  --ai:#2D4C9E; --ai-wash:#E3E9F7; --moegi:#3F7A33; --moegi-wash:#E4F0DF; --shu:#B0432C; --shu-wash:#F7E4DF; --kin:#9A6A12;
  --f-char:"Klee One","Zen Kaku Gothic New",serif;
  --f-body:"IBM Plex Sans KR","Zen Kaku Gothic New",system-ui,sans-serif;
  --f-jp:"Zen Kaku Gothic New","IBM Plex Sans KR",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11151D; --surface:#19202B; --ink:#E5E9F1; --ink-soft:#9AA4B7; --line:#2B3446; --grid:#34405A;
  --ai:#93AAEE; --ai-wash:#222D47; --moegi:#93C47D; --moegi-wash:#1F2F1C; --shu:#E99079; --shu-wash:#3A2420; --kin:#D9AE5B; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11151D; --surface:#19202B; --ink:#E5E9F1; --ink-soft:#9AA4B7; --line:#2B3446; --grid:#34405A;
  --ai:#93AAEE; --ai-wash:#222D47; --moegi:#93C47D; --moegi-wash:#1F2F1C; --shu:#E99079; --shu-wash:#3A2420; --kin:#D9AE5B; color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 110px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{font-family:var(--f-char);font-size:26px;font-weight:600;letter-spacing:.02em}
.brand small{font-family:var(--f-body);font-size:13px;color:var(--ink-soft);font-weight:400;margin-left:8px;letter-spacing:0}
.date{font-family:var(--f-mono);font-size:12px;color:var(--ink-soft)}
h2{font-size:18px;margin:0;text-wrap:balance}
h3{font-size:13px;margin:0;color:var(--ink-soft);font-weight:600;letter-spacing:.06em}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.muted{color:var(--ink-soft)}
.small{font-size:13px}
.jp{font-family:var(--f-jp)}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--ink-soft);font-size:12px}
nav.tabs button b{font-family:var(--f-char);font-size:20px;font-weight:600;line-height:1.2}
nav.tabs button[aria-current="page"]{color:var(--ai)}
/* buttons & chips */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500}
.btn:hover{border-color:var(--ai)}
.btn.primary{background:var(--ai);border-color:var(--ai);color:var(--surface)}
.btn.big{padding:12px 18px;font-size:16px;width:100%}
.btn:disabled{opacity:.5;cursor:default}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ai-wash);border-color:var(--ai);color:var(--ai);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 14px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ai);color:var(--surface)}
input[type=text],input[type=search],select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input[type=search]{width:100%}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat b{display:block;font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums;font-weight:500}
.stat span{font-size:12px;color:var(--ink-soft)}
@media (max-width:480px){.stats{grid-template-columns:repeat(2,1fr)}}
/* 田字格 square */
.sq{position:relative;aspect-ratio:1;max-width:100%;border:1.5px solid var(--grid);background:var(--surface);display:grid;place-items:center;font-family:var(--f-char)}
.sq::before,.sq::after{content:"";position:absolute;pointer-events:none}
.sq::before{left:50%;top:0;bottom:0;border-left:1px dashed var(--grid)}
.sq::after{top:50%;left:0;right:0;border-top:1px dashed var(--grid)}
.sq>*{position:relative;z-index:1}
/* kana grid */
.kgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.kgrid.y{grid-template-columns:repeat(3,minmax(0,1fr))}
.kcell{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:0;min-width:0}
.kcell .c{font-family:var(--f-char);font-size:26px;line-height:1.25}
.kcell .ro{font-family:var(--f-mono);font-size:11px;color:var(--ink-soft)}
.kcell .ko{font-size:11px;color:var(--ink-soft)}
.kcell.empty{visibility:hidden}
.kcell.known{border-color:var(--moegi);background:var(--moegi-wash)}
/* kanji tiles */
.jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:6px}
.jtile{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;min-width:0}
.jtile .c{font-family:var(--f-char);font-size:28px;line-height:1.2}
.jtile .ko{font-size:11px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding-inline:3px}
.jtile.known{border-color:var(--moegi);background:var(--moegi-wash)}
.jtile.learning{border-color:var(--kin)}
/* words */
.wlist{display:flex;flex-direction:column;gap:8px}
.word{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.word .w{font-family:var(--f-jp);font-size:20px;font-weight:500}
.word .r{font-family:var(--f-jp);color:var(--ink-soft);font-size:14px;margin-left:6px;font-weight:400}
.word .m{grid-column:1/-1}
.word .ex{grid-column:1/-1;font-size:13px;color:var(--ink-soft);border-top:1px dashed var(--line);padding-top:6px;margin-top:4px}
.word .ex .j{font-family:var(--f-jp);color:var(--ink)}
.tag{font-size:11px;border-radius:4px;padding:1px 6px;background:var(--ai-wash);color:var(--ai);white-space:nowrap;align-self:start}
.pos{font-size:11px;color:var(--ink-soft);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:2px}
.catblock{display:flex;flex-direction:column;gap:8px}
.cathead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cathead .n{font-family:var(--f-mono);font-size:12px;color:var(--ink-soft)}
/* flashcard */
.fc-wrap{display:flex;flex-direction:column;gap:14px;align-items:center}
.fc-bar{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12px;color:var(--ink-soft)}
.prog{height:4px;background:var(--line);border-radius:2px;width:100%;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ai);transition:width .2s}
.card{width:min(100%,420px);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:14px;min-height:340px;cursor:pointer;user-select:none}
.card .sq{width:min(64vw,220px)}
.card .front{font-size:clamp(64px,22vw,120px);line-height:1}
.card .front.long{font-size:clamp(28px,9vw,52px);font-family:var(--f-jp);font-weight:500;text-align:center;line-height:1.2;padding:8px}
.card .front.ko{font-family:var(--f-body);font-size:clamp(22px,6vw,32px);font-weight:600;text-align:center;padding:8px}
.card .hint{font-size:13px;color:var(--ink-soft)}
.card .back{width:100%;display:flex;flex-direction:column;gap:6px;text-align:center}
.card .back .big{font-size:22px;font-weight:600}
.card .back .jpbig{font-family:var(--f-jp);font-size:24px;font-weight:500}
.card .back dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;text-align:left;margin:6px 0 0;font-size:14px}
.card .back dt{color:var(--ink-soft);font-size:12px;padding-top:2px}
.card .back dd{margin:0;font-family:var(--f-jp)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(100%,420px)}
.rate button{border-radius:10px;padding:12px 4px;font-weight:600;border:1px solid}
.rate .again{background:var(--shu-wash);border-color:var(--shu);color:var(--shu)}
.rate .hard{background:var(--surface);border-color:var(--kin);color:var(--kin)}
.rate .good{background:var(--moegi-wash);border-color:var(--moegi);color:var(--moegi)}
.rate small{display:block;font-family:var(--f-mono);font-weight:400;font-size:11px;opacity:.8}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,14,24,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:720px;max-height:88%;overflow:auto;border-radius:16px 16px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.dhead{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center}
.dhead .sq{width:120px;font-size:84px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.dl dt{color:var(--ink-soft);font-size:13px}
.dl dd{margin:0;font-family:var(--f-jp);min-width:0}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
.empty-state{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--ink-soft)}
.setcat{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.setcat:last-child{border-bottom:0}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px}
.stepper button{border:0;background:none;width:30px;height:30px}
.stepper span{font-family:var(--f-mono);min-width:26px;text-align:center;font-variant-numeric:tabular-nums}
.switch{width:40px;height:24px;border-radius:12px;border:1px solid var(--line);background:var(--line);position:relative;padding:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:left .15s}
.switch[aria-checked="true"]{background:var(--ai);border-color:var(--ai)}
.switch[aria-checked="true"]::after{left:18px}
.gen-out{font-family:var(--f-mono);font-size:12px;color:var(--ink-soft);white-space:pre-wrap;max-height:90px;overflow:hidden}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;border:1px solid var(--line);margin-right:4px;vertical-align:-1px}
/* word button + popover */
.wbtn{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;border-bottom:1.5px dotted var(--ai);text-align:left}
.wbtn:hover{color:var(--ai)}
.pop-bg{position:fixed;inset:0;z-index:45}
.pop{position:fixed;z-index:46;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(15,22,40,.22);padding:14px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.pop-caret{position:fixed;z-index:47;width:14px;height:14px;background:var(--surface);border:1px solid var(--line);transform:rotate(45deg)}
.pop-caret.up{border-top:0;border-left:0}
.pop-caret.down{border-bottom:0;border-right:0}
.pop .ph{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.pop .ph .w{font-family:var(--f-jp);font-size:22px;font-weight:500}
.pop .ph .r{font-family:var(--f-jp);color:var(--ink-soft);margin-left:6px}
.pop .x{background:none;border:0;font-size:20px;color:var(--ink-soft);line-height:1;padding:0 4px}
.kp{display:grid;grid-template-columns:64px 1fr;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.kp .sq{width:64px;font-size:42px}
.kp .info{min-width:0;display:flex;flex-direction:column;gap:3px}
.kp .ko{font-weight:600}
.kp .rd{font-size:13px}
.kp .rd b{font-weight:500;color:var(--ink-soft);font-size:11px;margin-right:4px}
.kp .used{font-size:12px;background:var(--ai-wash);color:var(--ai);border-radius:4px;padding:1px 6px;align-self:flex-start}
.kp .exs{grid-column:1/-1;display:flex;flex-direction:column;gap:4px}
.kp .ex{display:grid;grid-template-columns:auto auto 1fr;gap:8px;align-items:baseline;font-size:14px;padding:4px 8px;background:var(--paper);border-radius:6px}
.kp .ex .j{font-family:var(--f-jp);font-weight:500}
.kp .ex .rr{font-family:var(--f-jp);color:var(--ink-soft);font-size:12px}
.kp .ex .src{font-size:10px;color:var(--moegi);margin-left:4px}
.kp .more{background:none;border:0;color:var(--ai);font-size:12px;padding:0;align-self:flex-start}
.loading{font-size:13px;color:var(--ink-soft)}
/* extract */
textarea{width:100%;min-height:120px;resize:vertical;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;font-family:var(--f-jp);font-size:15px;line-height:1.6}
.xitem{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.xitem:last-child{border-bottom:0}
.xitem input{margin-top:6px;width:18px;height:18px}
.xitem .w{font-family:var(--f-jp);font-size:17px;font-weight:500}
.xitem .r{font-family:var(--f-jp);color:var(--ink-soft);font-size:13px;margin-left:6px}
.xitem .dup{font-size:11px;color:var(--kin);margin-left:6px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;color:var(--ink-soft)}
.field input{width:100%}
.ph-drop{border:1.5px dashed var(--grid);border-radius:var(--r);min-height:170px;display:grid;place-items:center;background:var(--paper);overflow:hidden}
.ph-drop.has{border-style:solid;background:var(--surface)}
.ph-drop img{display:block;max-width:100%;max-height:320px;object-fit:contain}
.ph-empty{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:18px 12px}
.ph-icon{font-family:var(--f-char);font-size:30px;width:52px;height:52px;display:grid;place-items:center;border:1.5px solid var(--grid);color:var(--ai);margin-bottom:4px;background:var(--surface)}
.ph-thumb{display:block;max-width:100%;max-height:160px;border-radius:8px;border:1px solid var(--line);object-fit:contain;align-self:flex-start}
.transcript{background:var(--paper);border-radius:8px;padding:8px 12px;font-size:14px}
.transcript summary{cursor:pointer;color:var(--ink-soft);font-size:13px}
.transcript div{white-space:pre-wrap;margin-top:6px;line-height:1.7}
label.btn{cursor:pointer;display:inline-block}
.netbar{background:var(--shu-wash);color:var(--shu);border:1px solid var(--shu);border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:14px}
.say{display:inline-grid;place-items:center;width:30px;height:30px;margin-left:6px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ai);font-size:16px;padding:0;vertical-align:middle;cursor:pointer;flex:none}
.say:hover{border-color:var(--ai)}
.say.on{background:var(--ai);color:var(--surface);border-color:var(--ai)}
.say.sm{width:24px;height:24px;font-size:13px;margin-left:4px}
.say.lg{width:44px;height:44px;font-size:22px;margin:4px auto 0}
.card .back .say.lg{display:grid}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap" id="app">
  <header class="top">
    <div class="brand">ことば帳<small>코토바 노트 · 일본어 단어장</small></div>
    <div class="date" id="today-label"></div>
  </header>
  <div class="netbar" id="netbar" hidden>오프라인이에요. 사전·단어장·테스트는 그대로 쓸 수 있고, 단어 받기·사진·한자 예시는 인터넷이 연결되면 다시 돼요.</div>
  <main id="view"></main>
</div>
<nav class="tabs" aria-label="메뉴"><div class="in" id="tabs"></div></nav>

function kanaSet(kind, group){ // kind h|k
  const mk=(chars,ro,ko)=>chars.map((c,i)=>({c:kind==='k'?toKata(c):c,ro:ro[i],ko:ko[i]}));

// gojuon layout with blanks
function basicLayout(list){
  const by=Object.fromEntries(list.map(x=>[x.ro,x]));
  const order=["a i u e o","ka ki ku ke ko","sa shi su se so","ta chi tsu te to","na ni nu ne no","ha hi fu he ho","ma mi mu me mo","ya - yu - yo","ra ri ru re ro","wa - - - wo","n - - - -"];
  return order.flatMap(r=>r.split(" ").map(k=>k==='-'?null:by[k]));
}

// ---------- store ----------
const S={mode:"loading",db:null,uid:null,docs:{},ready:false};
const LKEY="kotoba-note-v1";
// On-device storage: IndexedDB (large, kept by installed apps) with a localStorage mirror as a second copy.
const IDB={db:null,timer:null};
function idbOpen(){
  return new Promise(ok=>{
    try{
      const rq=indexedDB.open("kotoba-note",1);
      rq.onupgradeneeded=()=>rq.result.createObjectStore("kv");
      rq.onsuccess=()=>ok(rq.result);rq.onerror=()=>ok(null);rq.onblocked=()=>ok(null);
    }catch(e){ok(null)}
  });
}
function idbGet(k){return new Promise(ok=>{try{const r=IDB.db.transaction("kv").objectStore("kv").get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(undefined)}catch(e){ok(undefined)}})}
function idbPut(k,v){return new Promise(ok=>{try{const t=IDB.db.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=()=>ok(true);t.onerror=t.onabort=()=>ok(false)}catch(e){ok(false)}})}
function localLoad(){try{const r=localStorage.getItem(LKEY);return r?JSON.parse(r):{}}catch(e){return {}}}
function flushLocal(){
  clearTimeout(IDB.timer);IDB.timer=null;
  const json=JSON.stringify(S.docs);
  if(IDB.db) idbPut("docs",{savedAt:Date.now(),json});
  try{localStorage.setItem(LKEY,json)}catch(e){/* full: IndexedDB still holds everything */}
}
function localSave(){clearTimeout(IDB.timer);IDB.timer=setTimeout(flushLocal,250)}
addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&IDB.timer)flushLocal()});
addEventListener("pagehide",()=>{if(IDB.timer)flushLocal()});
const wq={};
function save(id){
  localSave();
  if(!IN_CLAUDE)cloudMark(id);
  if(S.mode!=="db") return;
  const body=JSON.parse(JSON.stringify(S.docs[id]));
  wq[id]=(wq[id]||Promise.resolve()).then(()=>S.db.collection("data/users/"+S.uid).doc(id).set(body)).catch(e=>{
    if(e&&e.code==="invalid_argument"){S.mode="local";toast("계정에 저장할 수 없어 이 기기에 저장합니다.");render()}
    else toast("저장하지 못했어요. 잠시 후 다시 시도해 주세요.");
  });
}
let progTimer=null;
function saveProgressSoon(){clearTimeout(progTimer);progTimer=setTimeout(()=>{save("progress");save("stats")},1500)}
const DEVICE={persisted:null,usage:null};
async function initStore(){
  S.docs=localLoad();
  if(!IN_CLAUDE){
    IDB.db=await idbOpen();
    if(IDB.db){
      const rec=await idbGet("docs");
      if(rec&&rec.json){try{S.docs=JSON.parse(rec.json)}catch(e){}}
      else if(Object.keys(S.docs).length) flushLocal(); // first run of this version: copy old data into IndexedDB
    }
    try{
      if(navigator.storage&&navigator.storage.persist){
        DEVICE.persisted=await navigator.storage.persisted();
        if(!DEVICE.persisted) DEVICE.persisted=await navigator.storage.persist();
      }
      if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();DEVICE.usage=e.usage}
    }catch(e){}
    S.mode="local";S.ready=true;render();cloudInit();return;
  }
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    const id=user?await user.id():null;
    if(db&&id){
      S.db=db;S.uid=id;
      const snap=await db.collection("data/users/"+id).limit(1000).get();
      const remote={};snap.docs.forEach(d=>{remote[d.id]=JSON.parse(JSON.stringify(d.data()))});
      if(Object.keys(remote).length){S.docs=remote;localSave();S.mode="db"}
      else{S.mode="db";for(const k of Object.keys(S.docs))save(k)} // first run on this account: upload local data
    } else S.mode="local";
  }catch(e){S.mode="local"}
  S.ready=true;render();
}

// ---------- cloud sync (Firebase: sign-in + Firestore), GitHub Pages app only ----------
// Each entry of S.docs is one Firestore document at users/{uid}/docs/{id} = {j: JSON text, ts, dev}.
// Edits are queued on the device (CLOUD.dirty, kept across restarts) and pushed when online.
// When the same entry changed on two devices, the two versions are merged (words united, deleted words remembered in "tomb").
const FB_VER="10.12.2";
const CLOUD={cfg:null,loading:false,ready:false,user:null,unsub:null,dirty:new Set(),timer:null,lastSync:0,status:"",err:"",needRender:false,form:{email:"",mode:"login"}};
const DEVICE_ID=(()=>{try{let d=localStorage.getItem("kotoba-device");if(!d){d=Math.random().toString(36).slice(2,10);localStorage.setItem("kotoba-device",d)}return d}catch(e){return "dev"+Math.random().toString(36).slice(2,8)}})();
function cloudCfg(){
  if(window.KOTOBA_FIREBASE&&window.KOTOBA_FIREBASE.apiKey) return {cfg:window.KOTOBA_FIREBASE,src:"file"};
  try{const c=JSON.parse(localStorage.getItem("kotoba-firebase")||"null");if(c&&c.apiKey)return {cfg:c,src:"device"}}catch(e){}
  return null;
}
function parseFirebaseConfig(text){
  const o={};const re=/(apiKey|authDomain|projectId|storageBucket|messagingSenderId|appId|measurementId)\s*["']?\s*:\s*["']([^"']+)["']/g;let m;
  while((m=re.exec(text)))o[m[1]]=m[2];
  return o.apiKey&&o.projectId&&o.authDomain?o:null;
}
try{(JSON.parse(localStorage.getItem("kotoba-dirty")||"[]")||[]).forEach(id=>CLOUD.dirty.add(id));CLOUD.lastSync=+localStorage.getItem("kotoba-last-sync")||0}catch(e){}
function keepDirty(){try{localStorage.setItem("kotoba-dirty",JSON.stringify([...CLOUD.dirty]))}catch(e){}}
function cloudMark(id){
  if(IN_CLAUDE)return;
  CLOUD.dirty.add(id);keepDirty();
  clearTimeout(CLOUD.timer);CLOUD.timer=setTimeout(cloudPush,1500);
}
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>no(new Error("load "+src));document.head.append(s)})}
async function cloudInit(){
  if(IN_CLAUDE||CLOUD.ready||CLOUD.loading)return;
  const c=cloudCfg();if(!c)return;
  if(navigator.onLine===false){CLOUD.status="offline";return}
  CLOUD.loading=true;CLOUD.cfg=c;
  try{
    if(!window.firebase){
      const base=`https://www.gstatic.com/firebasejs/${FB_VER}/`;
      await loadScript(base+"firebase-app-compat.js");
      await Promise.all([loadScript(base+"firebase-auth-compat.js"),loadScript(base+"firebase-firestore-compat.js")]);
    }
    if(!firebase.apps.length)firebase.initializeApp(c.cfg);
    CLOUD.ready=true;
    try{await firebase.auth().getRedirectResult()}catch(e){CLOUD.err=authErr(e)}
    firebase.auth().onAuthStateChanged(u=>{
      CLOUD.user=u||null;
      if(CLOUD.unsub){CLOUD.unsub();CLOUD.unsub=null}
      if(u)cloudListen();else CLOUD.status="";
      cloudRender();
    });
  }catch(e){CLOUD.err="클라우드 기능을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.";}
  CLOUD.loading=false;cloudRender();
}
addEventListener("online",()=>{if(!CLOUD.ready)cloudInit();else if(CLOUD.user){if(!CLOUD.unsub)cloudListen();cloudPush()}});
function cloudCol(){return firebase.firestore().collection("users").doc(CLOUD.user.uid).collection("docs")}
function tomb(){return (S.docs.tomb||(S.docs.tomb={t:{}})).t}
function mergeOne(id,a,b){
  const m=mergeDocs({[id]:a},{[id]:b})[id];
  if(id==="tomb"){const t=m.t||(m.t={});for(const [k,v] of Object.entries((a&&a.t)||{}))t[k]=Math.max(t[k]||0,v);return m}
  const t=Object.assign({},(S.docs.tomb&&S.docs.tomb.t)||{});
  if(id.startsWith("w-")&&m&&Array.isArray(m.words))m.words=m.words.filter(w=>!t["w:"+w.id]);
  if(id==="settings"&&m&&Array.isArray(m.cats))m.cats=m.cats.filter(c=>!t["c:"+c.id]);
  return m;
}
function cloudListen(){
  CLOUD.status="syncing";cloudRender();
  let first=true;
  CLOUD.unsub=cloudCol().onSnapshot({includeMetadataChanges:false},snap=>{
    let changed=false;
    const seen=new Set();
    // apply "tomb" first so merges know which words were deleted elsewhere
    const changes=snap.docChanges().slice().sort((x,y)=>(y.doc.id==="tomb")-(x.doc.id==="tomb"));
    for(const ch of changes){
      const id=ch.doc.id;seen.add(id);
      if(ch.doc.metadata&&ch.doc.metadata.hasPendingWrites)continue;
      if(ch.type==="removed"){if(!CLOUD.dirty.has(id)&&S.docs[id]!==undefined){delete S.docs[id];changed=true}continue}
      const d=ch.doc.data();if(!first&&d.dev===DEVICE_ID)continue;
      let remote;try{remote=JSON.parse(d.j)}catch(e){continue}
      if(remote===null){if(!CLOUD.dirty.has(id)&&S.docs[id]!==undefined){delete S.docs[id];changed=true}continue}
      const local=S.docs[id];
      let next;
      if(local===undefined)next=remote;
      else if(CLOUD.dirty.has(id)||first){next=mergeOne(id,local,remote);if(JSON.stringify(next)!==d.j)CLOUD.dirty.add(id)}
      else next=remote;
      if(JSON.stringify(next)!==JSON.stringify(local)){S.docs[id]=next;changed=true}
    }
    if(first){
      // entries that exist only on this device go up to the cloud
      for(const id of Object.keys(S.docs))if(!seen.has(id))CLOUD.dirty.add(id);
      first=false;
      // re-apply tombs to word lists that were merged before the tomb arrived
      for(const id of Object.keys(S.docs))if(id.startsWith("w-")||id==="settings"){const m=mergeOne(id,S.docs[id],S.docs[id]);if(JSON.stringify(m)!==JSON.stringify(S.docs[id])){S.docs[id]=m;CLOUD.dirty.add(id);changed=true}}
    }
    keepDirty();
    if(changed){flushLocal();cloudRender(true)}
    CLOUD.status="ok";CLOUD.err="";
    if(CLOUD.dirty.size)cloudPush();else{CLOUD.lastSync=Date.now();try{localStorage.setItem("kotoba-last-sync",String(CLOUD.lastSync))}catch(e){};cloudRender()}
  },e=>{
    CLOUD.unsub=null;CLOUD.status="error";
    CLOUD.err=e&&e.code==="permission-denied"?"클라우드 저장소가 접근을 막았어요. Firebase의 Firestore 규칙을 안내대로 바꿔 주세요.":"클라우드와 연결이 끊겼어요. 잠시 뒤 다시 시도해요.";
    cloudRender();
    if(e&&e.code!=="permission-denied")setTimeout(()=>{if(CLOUD.user&&!CLOUD.unsub&&navigator.onLine!==false)cloudListen()},15000);
  });
}
let pushing=false;
async function cloudPush(){
  clearTimeout(CLOUD.timer);
  if(IN_CLAUDE||!CLOUD.user||!CLOUD.unsub||pushing||!CLOUD.dirty.size)return;
  if(navigator.onLine===false){CLOUD.status="offline";cloudRender();return}
  pushing=true;CLOUD.status="syncing";cloudRender();
  const ids=[...CLOUD.dirty].slice(0,400);
  try{
    const db=firebase.firestore();const batch=db.batch();const col=cloudCol();const ts=Date.now();
    for(const id of ids){
      const v=S.docs[id];
      const j=JSON.stringify(v===undefined?null:v);
      if(j.length>900000){CLOUD.err=`「${id}」 기록이 너무 커서 클라우드에 올리지 못했어요.`;continue}
      batch.set(col.doc(id),{j,ts,dev:DEVICE_ID});
    }
    await batch.commit();
    ids.forEach(id=>CLOUD.dirty.delete(id));keepDirty();
    CLOUD.lastSync=Date.now();try{localStorage.setItem("kotoba-last-sync",String(CLOUD.lastSync))}catch(e){}
    CLOUD.status="ok";
  }catch(e){
    CLOUD.status="error";
    CLOUD.err=e&&e.code==="permission-denied"?"클라우드 저장소가 저장을 막았어요. Firebase의 Firestore 규칙을 확인해 주세요.":"클라우드에 올리지 못했어요. 연결되면 다시 올려요.";
  }
  pushing=false;cloudRender();
  if(CLOUD.dirty.size&&CLOUD.status==="ok")setTimeout(cloudPush,300);
}
function cloudRender(dataChanged){
  const a=document.activeElement;
  if(a&&a.matches&&a.matches("input,textarea,select")){CLOUD.needRender=true;return}
  if(dataChanged||UI.tab==="set"||UI.tab==="home")render();
}
document.addEventListener("focusout",()=>{if(CLOUD.needRender){CLOUD.needRender=false;setTimeout(()=>{const a=document.activeElement;if(!(a&&a.matches&&a.matches("input,textarea,select")))render()},50)}});
function authErr(e){
  const c=(e&&e.code)||"";
  return ({
    "auth/invalid-credential":"이메일이나 비밀번호가 맞지 않아요.","auth/wrong-password":"비밀번호가 맞지 않아요.","auth/user-not-found":"가입된 이메일이 아니에요. \"처음이에요\"로 가입해 주세요.",
    "auth/invalid-login-credentials":"이메일이나 비밀번호가 맞지 않아요.","auth/email-already-in-use":"이미 가입된 이메일이에요. 로그인해 주세요.","auth/weak-password":"비밀번호는 6자 이상으로 정해 주세요.",
    "auth/invalid-email":"이메일 형식을 확인해 주세요.","auth/missing-password":"비밀번호를 넣어 주세요.","auth/too-many-requests":"시도가 너무 많았어요. 잠시 뒤 다시 해 주세요.",
    "auth/network-request-failed":"인터넷에 연결되지 않았어요.","auth/popup-closed-by-user":"로그인 창이 닫혔어요.","auth/cancelled-popup-request":"로그인 창이 닫혔어요.",
    "auth/unauthorized-domain":"이 주소는 Firebase에 등록되지 않았어요. Firebase → Authentication → 설정 → 승인된 도메인에 GitHub 주소를 넣어 주세요.",
    "auth/operation-not-allowed":"이 로그인 방식이 꺼져 있어요. Firebase → Authentication → 로그인 방법에서 켜 주세요.",
    "auth/configuration-not-found":"Firebase에서 Authentication을 아직 시작하지 않았어요. 안내 2단계를 확인해 주세요."
  })[c]||("로그인하지 못했어요."+(c?` (${c})`:""));
}
async function cloudEmail(kind){
  const em=(($("#cl-email")||{}).value||"").trim(),pw=(($("#cl-pw")||{}).value||"");
  CLOUD.form.email=em;CLOUD.err="";
  try{
    if(kind==="reset"){if(!em){CLOUD.err="이메일을 먼저 넣어 주세요.";cloudRender();return}await firebase.auth().sendPasswordResetEmail(em);toast("비밀번호 재설정 메일을 보냈어요.");return}
    if(kind==="signup")await firebase.auth().createUserWithEmailAndPassword(em,pw);
    else await firebase.auth().signInWithEmailAndPassword(em,pw);
    toast("로그인했어요. 기록을 합치는 중이에요.");
  }catch(e){CLOUD.err=authErr(e)}
  render();
}
async function cloudGoogle(){
  CLOUD.err="";
  const p=new firebase.auth.GoogleAuthProvider();
  try{await firebase.auth().signInWithPopup(p);toast("로그인했어요. 기록을 합치는 중이에요.")}
  catch(e){
    if(e&&(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment")){try{await firebase.auth().signInWithRedirect(p);return}catch(e2){CLOUD.err=authErr(e2)}}
    else CLOUD.err=authErr(e);
  }
  render();
}
async function cloudLogout(){
  if(CLOUD.dirty.size&&navigator.onLine!==false)await cloudPush();
  await firebase.auth().signOut();toast("로그아웃했어요. 이 기기의 기록은 그대로 남아요.");render();
}
function cloudPanel(){

    <textarea id="fb-paste" style="min-height:90px;font-family:var(--f-mono);font-size:12px" placeholder="const firebaseConfig = { apiKey: &quot;…&quot;, authDomain: &quot;…&quot;, projectId: &quot;…&quot;, … };"></textarea>

  const st=CLOUD.status==="syncing"?"동기화 중…":CLOUD.status==="offline"||navigator.onLine===false?`오프라인 · 연결되면 ${CLOUD.dirty.size}개 항목을 올려요`:CLOUD.status==="error"?"동기화 오류":CLOUD.dirty.size?`올릴 항목 ${CLOUD.dirty.size}개`:"모든 기기와 맞춰져 있어요";
  const last=CLOUD.lastSync?new Date(CLOUD.lastSync).toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}):"";

  if(CLOUD.user){
    const u=CLOUD.user;
    return `<div class="panel stack">${head}
      <div class="row" style="justify-content:space-between"><div style="min-width:0"><b>${esc(u.email||u.displayName||"로그인됨")}</b><div class="small muted">${esc(st)}${last?` · 마지막 동기화 ${esc(last)}`:""}</div></div>
      <span class="tag" style="background:${CLOUD.status==="error"?"var(--shu-wash)":"var(--moegi-wash)"};color:${CLOUD.status==="error"?"var(--shu)":"var(--moegi)"}">${CLOUD.status==="error"?"오류":"켜짐"}</span></div>
      ${err}
      <p class="small muted" style="margin:0">다른 기기에서도 같은 계정으로 로그인하면 단어장, 학습 기록, 분야 설정이 자동으로 맞춰져요. 인터넷이 없을 때 고친 내용은 연결되면 올라가요.</p>
      <div class="row"><button class="btn" type="button" data-act="cl-sync">지금 동기화</button><button class="btn" type="button" data-act="cl-logout">로그아웃</button></div>${foot}</div>`;
  }

  return `<form class="panel stack" id="cl-form">${head}

const GAPI="https://generativelanguage.googleapis.com/v1beta/models/";
const GMODE_KEY="kotoba-gemini-auth";
let THINK_OFF=false;
function gModeSaved(){try{return localStorage.getItem(GMODE_KEY)}catch(e){return null}}
function gModeSave(m){try{localStorage.setItem(GMODE_KEY,m)}catch(e){}}
function gGenCfg(model){
  const gc={responseMimeType:"application/json",temperature:0.7};

// One request. mode "header" sends the key in x-goog-api-key, mode "query" puts it in ?key=.
// Gives up when nothing arrives for `firstMs` (before the reply starts) or `idleMs` (while it streams).
async function gAttempt({model,key,mode,parts,signal,onText,firstMs,idleMs,stream}){
  const ctl=new AbortController();let timedOut=false;let timer=null;
  const arm=ms=>{clearTimeout(timer);timer=setTimeout(()=>{timedOut=true;ctl.abort()},ms)};
  const onUser=()=>ctl.abort();if(signal){if(signal.aborted)throw {code:"cancelled"};signal.addEventListener("abort",onUser,{once:true})}
  const t0=performance.now();const secs=()=>Math.round((performance.now()-t0)/1000);
  const qs=[];if(stream)qs.push("alt=sse");if(mode==="query")qs.push("key="+encodeURIComponent(key));
  const url=GAPI+encodeURIComponent(model)+(stream?":streamGenerateContent":":generateContent")+(qs.length?"?"+qs.join("&"):"");
  const headers={"Content-Type":"application/json"};if(mode==="header")headers["x-goog-api-key"]=key;
  try{
    arm(firstMs);
    let res;
    try{res=await fetch(url,{method:"POST",headers,signal:ctl.signal,body:JSON.stringify({contents:[{role:"user",parts}],generationConfig:gGenCfg(model)})})}
    catch(e){
      if(signal&&signal.aborted)throw {code:"cancelled"};
      return {kind:timedOut?"timeout":"net",info:timedOut?`${secs()}초 동안 응답 없음`:`연결 실패 (${(e&&e.message)||e})`};
    }
    if(!res.ok){
      clearTimeout(timer);
      let msg="";try{msg=(await res.json()).error.message||""}catch(e){}
      return {kind:"http",status:res.status,msg,info:`HTTP ${res.status}${msg?" "+msg.slice(0,120):""}`};
    }
    let text="";
    if(!stream){
      const j=await res.json();clearTimeout(timer);
      text=((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).filter(p=>!p.thought).map(p=>p.text||"").join("");
      return {kind:"ok",text,info:`${secs()}초`};
    }
    arm(idleMs);
    const rd=res.body.getReader();const dec=new TextDecoder();let buf="";
    for(;;){
      let r;
      try{r=await rd.read()}catch(e){
        if(signal&&signal.aborted)throw {code:"cancelled"};
        if(text)break;
        return {kind:timedOut?"timeout":"net",info:timedOut?`${secs()}초 동안 응답 없음`:"응답 도중 연결이 끊김"};
      }
      if(r.done)break;
      arm(idleMs);
      buf+=dec.decode(r.value,{stream:true});
      let i;
      while((i=buf.indexOf("\n\n"))>=0||(i=buf.indexOf("\r\n\r\n"))>=0){
        const ev=buf.slice(0,i);buf=buf.slice(i+(buf[i]==="\r"?4:2));
        for(const line of ev.split(/\r?\n/)){
          if(!line.startsWith("data:"))continue;
          let j;try{j=JSON.parse(line.slice(5).trim())}catch(e){continue}
          if(j.error)return {kind:"http",status:j.error.code||500,msg:j.error.message||"",info:`오류 ${j.error.message||""}`};
          const ps=(j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[];
          const add=ps.filter(p=>!p.thought).map(p=>p.text||"").join("");
          if(add){text+=add;if(onText)onText({text,delta:add})}
        }
      }
    }
    clearTimeout(timer);
    return {kind:"ok",text,info:`${secs()}초`};
  }finally{clearTimeout(timer);if(signal)signal.removeEventListener("abort",onUser)}
}
async function geminiJSON(prompt,{signal,onText,images}={}){
  const cfg=geminiCfg();const key=(cfg.key||"").trim();
  if(!key) throw {code:"no_key"};
  if(navigator.onLine===false) throw {code:"offline"};
  const model=(cfg.model||GDEF).trim();
  const parts=[{text:prompt}];
  if(images){const b64=await new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>ok(String(fr.result).split(",")[1]);fr.onerror=no;fr.readAsDataURL(images)});parts.unshift({inlineData:{mimeType:images.type||"image/jpeg",data:b64}})}
  const saved=gModeSaved();
  const order=saved==="query"?["query","header"]:["header","query"];
  // If the chosen model is busy (high demand / quota), fall back to other Flash models; each has its own free quota.
  const models=[...new Set([model,"gemini-flash-latest","gemini-flash-lite-latest","gemini-3.5-flash-lite","gemini-3.5-flash","gemini-3.1-flash-lite"])];
  const isBusy=r=>r.kind==="http"&&([429,500,502,503,504].includes(r.status)||/demand|overload|unavailable|exhausted|try again|capacity/i.test(r.msg||""));
  const notes=[];let busySeen=false,quotaSeen=false;
  for(const m of models){
    let modelDone=false;
    for(const mode of order){
      if(modelDone)break;
      const run=()=>gAttempt({model:m,key,mode,parts,signal,onText,firstMs:images?90000:60000,idleMs:30000,stream:true});
      let r=await run();
      if(r.kind==="http"&&r.status===400&&/think/i.test(r.msg)&&!THINK_OFF){THINK_OFF=true;r=await run()}
      if(isBusy(r)&&r.status!==429){await new Promise(ok=>setTimeout(ok,1500));if(signal&&signal.aborted)throw {code:"cancelled"};r=await run()}
      const label=`${m} · ${mode==="header"?"헤더 방식":"주소 방식"}`;
      if(r.kind==="ok"){
        gModeSave(mode);
        if(!r.text.trim()){notes.push(`${label}: 빈 답`);modelDone=true;continue}
        if(m!==model) toast(`${model}이(가) 붐벼서 ${m}(으)로 답했어요.`);
        return looseJSON(r.text);
      }
      notes.push(`${label}: ${r.info}`);
      if(r.kind==="http"){
        if(r.status===401||r.status===403||(r.status===400&&/key|credential|auth/i.test(r.msg))) continue; // other way of sending the key
        if(isBusy(r)){busySeen=true;if(r.status===429)quotaSeen=true;modelDone=true;continue} // next model
        if(r.status===404||(r.status===400&&/model/i.test(r.msg))){modelDone=true;continue}      // model not available to this key
        throw {code:"upstream_error",message:r.info};
      }
      // timeout or network: try the other way of sending the key, then give up on this model
    }
    if(!busySeen&&notes.every(n=>/응답 없음|연결 실패|끊김/.test(n))) break; // the network itself is the problem; other models won't help
  }
  if(busySeen) throw {code:quotaSeen?"quota":"busy",message:notes.slice(-3).join(" / ")};
  const anyAuth=notes.some(n=>/HTTP (401|403)/.test(n));
  throw {code:anyAuth?"bad_key":notes.some(n=>/응답 없음/.test(n))?"timeout":"network",message:notes.slice(-4).join(" / ")};
}

  $("#tabs").innerHTML=TABS.map(([id,ch,lb])=>`<button data-tab="${id}" ${UI.tab===id?'aria-current="page"':""}><b>${ch}</b>${lb}</button>`).join("");
}
addEventListener("online",()=>render());addEventListener("offline",()=>render());
function render(){
  const nb=$("#netbar");if(nb)nb.hidden=navigator.onLine!==false;
  $("#today-label").textContent=new Date().toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric",weekday:"short"});
  renderTabs();
  const v=$("#view");
  if(UI.tab==="test"&&UI.session) v.innerHTML=viewSession();
  else v.innerHTML=({home:viewHome,dict:viewDict,words:viewWords,test:viewTest,set:viewSet})[UI.tab]();

function streak(){const d=stats();let n=0;let t=new Date();if(!d[dayStr(t)]){t.setDate(t.getDate()-1)}while(d[dayStr(t)]){n++;t.setDate(t.getDate()-1)}return n}
function dueCount(){const p=progress(),t=dayNum(TODAY);let n=0;for(const v of Object.values(p)){if(v[0]<3&&v[1]<=t)n++}return n}

function missingToday(){
  const ws=allWords().filter(w=>w.date===TODAY);
  return settings().cats.filter(c=>c.on).map(c=>({c,need:Math.max(0,c.count-ws.filter(w=>w.cat===c.id).length)})).filter(x=>x.need>0);
}

// ---------- pronunciation (device text-to-speech, works offline when a Japanese voice is installed) ----------
const TTS={ok:typeof speechSynthesis!=="undefined"&&typeof SpeechSynthesisUtterance!=="undefined",voice:null,warned:false,rate:1};
try{TTS.rate=+localStorage.getItem("kotoba-tts-rate")||1}catch(e){}
function pickVoice(){
  if(!TTS.ok)return null;
  const vs=speechSynthesis.getVoices().filter(v=>/^ja(-|_|$)/i.test(v.lang));
  TTS.voice=vs.find(v=>/kyoko|otoya|google|o-ren|haruka|nanami|ayumi/i.test(v.name))||vs.find(v=>v.localService)||vs[0]||null;
  return TTS.voice;
}
if(TTS.ok){pickVoice();speechSynthesis.addEventListener&&speechSynthesis.addEventListener("voiceschanged",pickVoice)}
function speak(text,btn){
  text=String(text||"").replace(/[.\-]/g,"").trim();if(!text)return;
  if(!TTS.ok){toast("이 브라우저는 소리 읽기를 지원하지 않아요.");return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="ja-JP";u.rate=TTS.rate*0.9;
  const v=TTS.voice||pickVoice();if(v)u.voice=v;
  else if(!TTS.warned){TTS.warned=true;setTimeout(()=>{if(!speechSynthesis.speaking)toast("일본어 음성이 없어요. 기기 설정 → 언어/음성에서 일본어 음성을 받아 주세요.")},900)}
  if(btn){document.querySelectorAll(".say.on").forEach(b=>b.classList.remove("on"));btn.classList.add("on");const off=()=>btn.classList.remove("on");u.onend=off;u.onerror=off}
  speechSynthesis.speak(u);
}
const SAY_ICON='<svg viewBox="0 0 20 20" width="1em" height="1em" aria-hidden="true"><path d="M3 7.5h3l4-3.5v12l-4-3.5H3z" fill="currentColor"/><path d="M13 7a4 4 0 0 1 0 6M15.2 4.8a7 7 0 0 1 0 10.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
const say=(text,label,cls="")=>text?`<button type="button" class="say ${cls}" data-say="${esc(text)}" aria-label="${esc(label||text)} 발음 듣기" title="발음 듣기">${SAY_ICON}</button>`:"";
const sayW=w=>say(w.r||w.w,w.w);

function wordCard(w,showCat){
  return `<div class="word"><div><button class="w wbtn" data-wp="${esc(w.id)}" aria-label="${esc(w.w)} 한자 풀이 보기">${esc(w.w)}</button>${w.r&&w.r!==w.w?`<span class="r">${esc(w.r)}</span>`:""}${sayW(w)}${w.pos?`<span class="pos">${esc(w.pos)}</span>`:""}</div>
  ${showCat?`<span class="tag">${esc(catName(w.cat))}</span>`:"<span></span>"}

}

function viewHome(){

  const kk=known.filter(([k])=>k.startsWith("k:")).length, wk=known.filter(([k])=>k.startsWith("w:")).length;
  const miss=missingToday();const total=miss.reduce((a,x)=>a+x.need,0);

  if(UI.gen){gen=`<div class="panel stack"><div class="row" style="justify-content:space-between"><b>오늘의 단어를 고르는 중…</b><button class="btn" data-act="gen-stop">중지</button></div><div class="gen-out" id="gen-out">${esc(UI.gen.text||("잠시만 기다려 주세요. "+(IN_CLAUDE?"처음에는 Claude 사용 허락을 묻는 창이 뜰 수 있어요.":"Gemini가 생각을 마치면 쓰는 대로 보여 줘요.")))}</div></div>`}
  else if(total>0){gen=`<div class="panel stack"><div><h2>오늘의 단어가 준비되지 않았어요</h2><p class="muted small" style="margin:4px 0 0">${miss.map(x=>`${esc(x.c.name)} ${x.need}개`).join(" · ")}</p></div><button class="btn primary big" data-act="gen">오늘의 단어 ${total}개 받기</button></div>`}
  const groups=cats.map(c=>{const ws=today.filter(w=>w.cat===c.id);if(!ws.length)return"";return `<section class="catblock"><div class="cathead"><h3>${esc(c.name)} <span class="muted" style="font-weight:400">· ${KIND_LABEL[c.kind]||""}</span></h3><span class="n">${ws.length}</span></div><div class="wlist">${ws.map(w=>wordCard(w)).join("")}</div></section>`}).join("");

      <div class="stat"><b>${wk}<span class="muted" style="font-size:12px">/${allWords().length}</span></b><span>외운 단어</span></div>

    ${groups}

    ${!today.length&&!total&&!UI.gen?`<div class="empty-state">켜 둔 분야가 없어요. 설정에서 공부할 분야나 좋아하는 애니메이션·노래를 추가해 주세요.</div>`:""}
    ${!IN_CLAUDE&&allWords().length>=10&&Date.now()-lastBackup()>14*864e5?`<div class="panel row" style="justify-content:space-between"><span class="small">${lastBackup()?"마지막 백업이 2주 넘게 지났어요.":"아직 백업 파일이 없어요."} 기기를 바꿀 때를 대비해 저장해 두세요.</span><button class="btn" data-act="bk-export">백업 파일 저장</button></div>`:""}
    <p class="muted small">분야와 하루 개수는 <a href="#" data-tab="set" style="color:var(--ai)">설정</a>에서 바꿀 수 있어요. ${S.mode==="db"?"학습 기록은 내 Claude 계정에 저장돼요.":S.mode==="local"?"학습 기록은 이 기기에 저장돼서 인터넷 없이도 남아요.":""}</p>

// ---------- word popover ----------
const KMAP=new Map(KANJI.map(k=>[k[0],k]));
const isKanji=c=>/[㐀-鿿豈-﫿々]/.test(c);
const POP={word:null,anchor:null,ctl:null,busy:false,err:"",open:{}};
function xDocId(w){return "x-"+hash(w.w+"|"+(w.r||""))}
function openWordPop(anchor,w){
  closePop();
  POP.word=w;POP.anchor=anchor;POP.err="";POP.open={};
  renderPop();
  const kanji=[...new Set([...w.w].filter(c=>isKanji(c)&&c!=="々"))];
  if(kanji.length&&!S.docs[xDocId(w)]) fetchWordInfo(w,kanji);
}
function closePop(){if(POP.ctl)POP.ctl.abort();POP.ctl=null;POP.busy=false;POP.word=null;const p=$("#popwrap");if(p)p.remove()}
async function fetchWordInfo(w,kanji){
  const ctl=new AbortController();POP.ctl=ctl;POP.busy=true;renderPop();
  const prompt=`A Korean-speaking learner is studying the Japanese word 「${w.w}」${w.r?` (read ${w.r})`:""}${w.m?`, meaning "${w.m}"`:""}.
For each kanji in it (${kanji.join(", ")}):
- "used": the reading this kanji takes inside this word, in hiragana (for 熟字訓 / jukujikun words, give the whole word's reading on the first kanji and "" on the rest),
- "type": one of "음독" (on'yomi), "훈독" (kun'yomi), "특수" (jukujikun or irregular),
- "ex": 4 common example words that use this kanji, other than 「${w.w}」, chosen to show different readings (mix on'yomi and kun'yomi words where they exist), each {"w": word, "r": hiragana reading, "m": short natural Korean meaning, "t": "음독" or "훈독" for how the kanji is read in that example}.
Reply with only JSON: {"parts":[{"c":"駅","used":"えき","type":"음독","ex":[{"w":"駅前","r":"えきまえ","m":"역 앞","t":"음독"}]}]}`;
  try{
    const res=await aiJSON(prompt,{signal:ctl.signal,quick:true});
    const parts=(res&&Array.isArray(res.parts)?res.parts:[]).filter(p=>p&&p.c).map(p=>({c:String(p.c),used:String(p.used||""),type:String(p.type||""),ex:(Array.isArray(p.ex)?p.ex:[]).filter(e=>e&&e.w).slice(0,6).map(e=>({w:String(e.w),r:String(e.r||""),m:String(e.m||""),t:String(e.t||"")}))}));
    if(parts.length){const id=xDocId(w);S.docs[id]={w:w.w,r:w.r||"",parts};save(id)}
    else POP.err="예시 단어를 받지 못했어요.";
  }catch(e){if(e&&e.code!=="cancelled")POP.err=aiErr(e)}
  if(POP.ctl===ctl){POP.ctl=null;POP.busy=false;renderPop()}
}
function popBody(w){
  const info=S.docs[xDocId(w)];
  const chars=[...w.w].filter(c=>isKanji(c)&&c!=="々");
  const uniq=[...new Set(chars)];
  const mine=allWords();
  const blocks=uniq.map(c=>{
    const k=KMAP.get(c);
    const p=info&&info.parts.find(x=>x.c===c);
    const own=mine.filter(x=>x.w!==w.w&&x.w.includes(c)).slice(0,3).map(x=>({w:x.w,r:x.r,m:x.m,own:true}));
    const ai=p?p.ex.filter(e=>!own.some(o=>o.w===e.w)):[];
    const all=[...own,...ai];
    const lim=POP.open[c]?all.length:4;
    const on=k?k[4].split(",").filter(Boolean).map(r=>r.replace(/-/g,"")).join("、"):"";
    const ku=k?k[5].split(",").filter(Boolean).map(r=>kun(r.replace(/-/g,""))).join("、"):"";
    return `<div class="kp"><div class="sq" role="button" tabindex="0" data-kanji="${esc(c)}" title="자세히"><span>${esc(c)}</span></div>
      <div class="info"><div class="ko">${esc(k?(k[6]||k[8]):"상용한자 밖의 글자")}</div>
        ${p&&p.used?`<span class="used">이 단어에서 ${esc(p.used)} · ${esc(p.type)}</span>`:""}
        ${k?`<div class="rd jp"><b>음</b>${esc(on||"—")}${say(on,"음독","sm")}</div><div class="rd jp"><b>훈</b>${esc(ku||"—")}${say(ku.replace(/[()]/g,""),"훈독","sm")}</div>`:""}
      </div>
      <div class="exs">${all.slice(0,lim).map(e=>`<div class="ex"><span class="j">${esc(e.w)}${say(e.r||e.w,e.w,"sm")}</span><span class="rr">${esc(e.r)}</span><span>${esc(e.m)}${e.own?`<span class="src">내 단어장</span>`:e.t?`<span class="src" style="color:var(--ink-soft)">${esc(e.t)}</span>`:""}</span></div>`).join("")}
        ${all.length>lim?`<button class="more" data-popmore="${esc(c)}">예시 ${all.length-lim}개 더 보기</button>`:""}
        ${!all.length&&!POP.busy&&!POP.err?`<span class="loading">예시 단어가 없어요.</span>`:""}</div></div>`;
  }).join("");
  return `<div class="ph"><div><span class="w">${esc(w.w)}</span>${w.r&&w.r!==w.w?`<span class="r">${esc(w.r)}</span>`:""}${sayW(w)}<div class="small muted">${esc(w.m||"")}</div></div><button class="x" data-act="pop-close" aria-label="닫기">×</button></div>
    ${uniq.length?blocks:`<div class="loading">한자가 없는 단어예요.</div>`}
    ${POP.busy?`<div class="loading">${AI_NAME}가 한자별 읽기와 예시 단어를 찾는 중…</div>`:""}
    ${POP.err?`<div class="loading" style="color:var(--shu)">${esc(POP.err)} ${uniq.length?`<button class="more" data-act="pop-retry">다시 시도</button>`:""}</div>`:""}`;
}
function renderPop(){
  const w=POP.word;if(!w)return;
  let wrap=$("#popwrap");
  if(!wrap){wrap=document.createElement("div");wrap.id="popwrap";wrap.innerHTML=`<div class="pop-bg" data-act="pop-close"></div><div class="pop" role="dialog" aria-label="한자 풀이"></div><div class="pop-caret"></div>`;document.body.append(wrap)}
  const pop=wrap.querySelector(".pop"),car=wrap.querySelector(".pop-caret");
  const st=pop.scrollTop;pop.innerHTML=popBody(w);pop.scrollTop=st;
  placePop();
}
function placePop(){
  const wrap=$("#popwrap");if(!wrap||!POP.word)return;
  const pop=wrap.querySelector(".pop"),car=wrap.querySelector(".pop-caret");
  const r=POP.anchor&&POP.anchor.isConnected?POP.anchor.getBoundingClientRect():{left:innerWidth/2,width:0,top:innerHeight/2,bottom:innerHeight/2};
  const W=Math.min(400,innerWidth-24);const navH=64;
  const left=Math.max(12,Math.min(innerWidth-W-12,r.left+r.width/2-W/2));
  pop.style.width=W+"px";pop.style.left=left+"px";
  const above=r.top-12, below=innerHeight-r.bottom-navH-12;
  const cx=Math.max(left+16,Math.min(left+W-30,r.left+r.width/2-7));
  car.style.left=cx+"px";
  if(above>=Math.min(320,below)||above>260){
    pop.style.top="";pop.style.bottom=(innerHeight-r.top+9)+"px";pop.style.maxHeight=Math.max(160,above-8)+"px";
    car.className="pop-caret up";car.style.top=(r.top-16)+"px";

async function shrinkImage(file){
  try{
    const bmp=await createImageBitmap(file);
    const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",0.88));
  }catch(e){return file}
}

function testSets(){
  const sets=[];
  sets.push({id:"today",label:"오늘의 단어",group:"단어"});
  sets.push({id:"due",label:"복습할 카드",group:"단어"});
  const used=[...new Set(allWords().map(w=>w.cat))];
  for(const c of settings().cats) if(used.includes(c.id)) sets.push({id:"c:"+c.id,label:c.name,group:"단어"});
  for(const id of used) if(!settings().cats.some(c=>c.id===id)) sets.push({id:"c:"+id,label:catName(id),group:"단어"});
  for(const [k,l] of [["h:basic","ひらがな 기본"],["h:daku","ひらがな 탁음"],["h:yoon","ひらがな 요음"],["k:basic","カタカナ 기본"],["k:daku","カタカナ 탁음"],["k:yoon","カタカナ 요음"]]) sets.push({id:"kana:"+k,label:l,group:"가나"});
  for(const g of [1,2,3,4,5,6,8]) sets.push({id:"g:"+g,label:"한자 "+GRADE_LABEL[g],group:"한자 (학년)"});
  for(const n of [5,4,3,2,1]) sets.push({id:"n:"+n,label:"한자 N"+n,group:"한자 (JLPT)"});
  return sets;
}
function itemsFor(setId){
  const W=allWords();
  const wi=w=>({key:"w:"+w.id,type:"word",w});
  if(setId==="today") return W.filter(w=>w.date===TODAY).map(wi);
  if(setId==="due"){const p=progress(),t=dayNum(TODAY);const out=[];
    for(const [k,v] of Object.entries(p)){if(v[0]>=3||v[1]>t)continue;const it=itemFromKey(k,W);if(it)out.push(it)}return out}
  if(setId.startsWith("c:")) return W.filter(w=>w.cat===setId.slice(2)).map(wi);
  if(setId.startsWith("kana:")){const [kind,g]=setId.slice(5).split(":");return kanaSet(kind,g).map(x=>({key:(kind==="h"?"h:":"t:")+x.c,type:"kana",x,kind}))}
  if(setId.startsWith("g:")) return KANJI.filter(k=>String(k[1])===setId.slice(2)).map(k=>({key:"k:"+k[0],type:"kanji",k}));
  if(setId.startsWith("n:")) return KANJI.filter(k=>String(k[2])===setId.slice(2)).map(k=>({key:"k:"+k[0],type:"kanji",k}));
  return [];
}
function itemFromKey(key,W){
  const [p,v]=[key.slice(0,2),key.slice(2)];
  if(p==="w:"){const w=W.find(x=>x.id===v);return w?{key,type:"word",w}:null}
  if(p==="k:"){const k=KANJI.find(x=>x[0]===v);return k?{key,type:"kanji",k}:null}
  if(p==="h:"||p==="t:"){const kind=p==="h:"?"h":"k";const x=["basic","daku","yoon"].flatMap(g=>kanaSet(kind,g)).find(y=>y.c===v);return x?{key,type:"kana",x,kind}:null}
  return null;
}

  return `<div class="stack">

  </div>`;
}
function startSession(keys){
  const pool=new Map();
  if(keys) for(const it of keys) pool.set(it.key,it);
  else for(const id of UI.sel)for(const it of itemsFor(id))pool.set(it.key,it);
  let items=shuffle([...pool.values()]);
  if(UI.order==="due"&&!keys){const t=dayNum(TODAY);const score=it=>{const p=progress()[it.key];if(!p)return 1;return p[0]>=3?3+(p[1]>t?1:0):(p[1]<=t?0:2)};items.sort((a,b)=>score(a)-score(b))}
  if(UI.count&&!keys) items=items.slice(0,UI.count);

function cardHTML(it,flipped){

      <dl><dt>음독</dt><dd>${esc(k[4].replace(/-/g,"").split(",").join("、")||"—")}${say(k[4].split(",").filter(Boolean).join("、"),"음독","sm")}</dd><dt>훈독</dt><dd>${esc(k[5].split(",").filter(Boolean).map(r=>kun(r.replace(/-/g,""))).join("、")||"—")}${say(k[5].split(",").filter(Boolean).join("、"),"훈독","sm")}</dd></dl>`;
  } else {

function viewSession(){

  </div>`;
}
const INTERVAL=[0,1,3,7,16,35];
function rate(r){
  const s=UI.session;const it=s.items[s.i];const p=progress();
  const cur=p[it.key]?p[it.key][0]:-1;
  let box=r==="again"?0:r==="hard"?Math.max(0,cur<0?0:cur):Math.min(5,cur+1);
  if(r==="good"&&cur<0) box=1;
  p[it.key]=[box,dayNum(TODAY)+(r==="again"?0:INTERVAL[box]||1)];
  s.res[r].push(it);
  const d=stats();d[TODAY]=(d[TODAY]||0)+1;
  s.i++;s.flipped=false;saveProgressSoon();render();
}

// ---------- generation ----------
async function generate(){
  if(UI.gen) return;
  if(!IN_CLAUDE&&!geminiCfg().key){toast("설정에서 Gemini API 키를 먼저 넣어 주세요.");UI.tab="set";render();return}
  const miss=missingToday();if(!miss.length)return;
  const W=allWords();
  const cats=miss.map(({c,need})=>({id:c.id,name:c.name,kind:c.kind,count:need,already:W.filter(w=>w.cat===c.id).slice(0,250).map(w=>w.w)}));
  const prompt=`You choose daily Japanese vocabulary for a Korean-speaking learner. Learner level: ${LEVELS[settings().level]}. Today: ${TODAY}.
For each category below, give exactly "count" NEW words that are not in its "already" list and not duplicated across categories.
- kind "topic": common, useful words for that situation, matched to the learner's level (slightly above is fine).
- kind "anime" / "song" / "drama" / "game": words that genuinely appear in or are central to that work (key terms, character/world vocabulary, recurring expressions, themes). Never quote lyrics or lines of dialogue. Example sentences must be your own original sentences.
- If you don't recognise a work, pick words fitting its likely genre and say so in "note".
Fields: "w" word as normally written (kanji where usual), "r" reading in hiragana, "m" meaning in natural Korean, "pos" part of speech in Korean (명사, 동사, い형용사, な형용사, 부사, 표현 …), "ex" a short original Japanese example sentence, "exk" its Korean translation, "note" optional short Korean tip (usage, nuance, or where it appears in the work), or "".
Categories: ${JSON.stringify(cats)}
Reply with only one JSON object mapping each category id to its array, e.g. {"travel":[{"w":"切符","r":"きっぷ","m":"표, 승차권","pos":"명사","ex":"駅で切符を買いました。","exk":"역에서 표를 샀습니다.","note":""}]}`;
  const ctl=new AbortController();UI.gen={ctl,text:""};render();
  try{
    const res=await aiJSON(prompt,{signal:ctl.signal,onText:({text})=>{UI.gen.text=text.slice(-400);const o=$("#gen-out");if(o)o.textContent=UI.gen.text}});
    let n=0;
    for(const {c} of miss){const arr=res&&Array.isArray(res[c.id])?res[c.id]:[];n+=addWords(c.id,arr,TODAY)}
    UI.gen=null;toast(n?`오늘의 단어 ${n}개를 추가했어요.`:"새 단어를 받지 못했어요. 다시 시도해 주세요.");
  }catch(e){
    UI.gen=null;const c=e&&e.code;
    if(c!=="cancelled")toast(aiErr(e));
  }
  render();
}

document.addEventListener("change",e=>{
  if(e.target.id==="lvl"){settings().level=+e.target.value;save("settings")}
  if(e.target.id==="ext-cat"){if(e.target.value==="__new"){NEWCAT.open=true;render();const i=$("#nc-name");if(i)i.focus()}else{EXT.cat=e.target.value;NEWCAT.open=false;if(EXT.items){const h=haveIn(EXT.cat);EXT.items.forEach(x=>x.on=!h.has(x.w))}render()}}
  if(e.target.id==="nc-kind")NEWCAT.kind=e.target.value;
  if(e.target.id==="bk-file"&&e.target.files&&e.target.files[0]){readBackup(e.target.files[0]);e.target.value=""}
  if((e.target.id==="ph-cam"||e.target.id==="ph-pick")&&e.target.files&&e.target.files[0])setPhoto(e.target.files[0]);
  if(e.target.dataset.xi!==undefined&&EXT.items){EXT.items[+e.target.dataset.xi].on=e.target.checked;render()}
});
function readGemForm(){const k=$("#gem-key"),m=$("#gem-model");return {key:(k?k.value:"").trim(),model:(m&&m.value.trim())||GDEF}}
document.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="addw"){
    const w=$("#aw-w").value.trim(),r=$("#aw-r").value.trim(),m=$("#aw-m").value.trim(),c=$("#aw-c").value;
    if(!w||!m)return;const n=addWords(c,[{w,r,m}],TODAY);toast(n?"추가했어요.":"이미 있는 단어예요.");render();
  }
  if(e.target.id==="cl-form"){cloudEmail(CLOUD.form.mode==="signup"?"signup":"login");return}
  if(e.target.id==="gemform"){toast(setGeminiCfg(readGemForm())?"저장했어요.":"이 브라우저에서는 키를 저장할 수 없어요.");render();return}
  if(e.target.id==="addcat"){
    const name=$("#ac-name").value.trim(),kind=$("#ac-kind").value;if(!name)return;
    settings().cats.push({id:"c"+Date.now().toString(36),name,kind,count:5,on:true});save("settings");toast(`'${name}'을(를) 추가했어요.`);render();
  }
});

document.addEventListener("dragover",e=>{if(e.target.closest&&e.target.closest("#ph-drop"))e.preventDefault()});
document.addEventListener("drop",e=>{const z=e.target.closest&&e.target.closest("#ph-drop");if(!z)return;e.preventDefault();const f=e.dataTransfer&&e.dataTransfer.files[0];if(f)setPhoto(f)});
document.addEventListener("paste",e=>{if(UI.tab!=="words"||EXT.mode!=="photo"||EXT.busy)return;const f=[...(e.clipboardData&&e.clipboardData.files||[])].find(x=>/^image\//.test(x.type));if(f){e.preventDefault();setPhoto(f)}});
render();initStore();checkImageSupport();
</script>

</body></html>
